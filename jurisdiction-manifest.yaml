# jurisdiction-manifest.yaml
# The only place VERCEL_PROJECT_ID / VERCEL_ORG_ID pairs are allowed to exist.
# Agents read this file. They never receive raw project/org IDs as free-floating secrets.

jurisdictions:
  proofbridge:
    status: ACTIVE
    vercel_project_id: prj_vjCCZQLgL4VymDQiWRv8oK0jbrBV
    vercel_org_id: team_oSaLEdmc8m1I6oEuexLCfWpw
    branch: main
    agents: [kilo-implementer, kilo-validator]
    secrets_scope: [PROOFBRIDGE_*, VERCEL_TOKEN_PROOFBRIDGE]

  ubuntu-pools:
    status: ACTIVE
