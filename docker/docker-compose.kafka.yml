# VVU-IVE Webhook Subsystem — Local Kafka (Docker Compose)
# ----------------------------------------------------------------------------
# For local dev / integration tests. Production uses AWS MSK (per v1.1 contract).
#
# Usage:
#   docker compose -f docker/docker-compose.kafka.yml up -d
#   # Wait ~10s for Kafka to boot
#   bun run webhook:create-topics
#   bun run webhook:worker
#
# Tear down:
#   docker compose -f docker/docker-compose.kafka.yml down -v

# KRaft mode (no Zookeeper needed) — modern Kafka 3.3+
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vvu-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft mode config
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      # Match v1.1 contract defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1  # single-broker dev only
      KAFKA_MIN_INSYNC_REPLICAS: 1  # single-broker dev only
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics must be created explicitly
      CLUSTER_ID: "vvu-ive-webhook-dev-cluster"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kafka_data:
