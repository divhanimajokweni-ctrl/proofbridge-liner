<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VVU · The Colony — Trust Operating Model</title>
    <meta name="description" content="Venture Vision Ubuntu — The Colony: a living visual operating model for trust." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='35' cy='40' r='16' stroke='%238A9A5B' stroke-width='7' fill='none'/%3E%3Ccircle cx='65' cy='40' r='16' stroke='%23CC7722' stroke-width='7' fill='none'/%3E%3Ccircle cx='50' cy='64' r='16' stroke='%23E2E3DB' stroke-width='7' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07080A;
            --bg-raised: #0C0D10;
            --bg-overlay: #121418;
            --bg-inset: #030405;
            --border-hairline: #1A1C22;
            --text-primary: #E8EAED;
            --text-secondary: #8E949E;
            --text-tertiary: #4E545E;
            --state-verified: #2FBF71;
            --state-pending: #E8A23D;
            --state-hazard: #E5484D;
            --state-idle: #4E545E;
            --font-display: 'Fragment Mono', 'JetBrains Mono', monospace;
            --font-body: 'Inter Tight', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
            --r-pill: 999px;
            --dur-state: 300ms;
            --dur-hazard: 500ms;
            --ease-state: cubic-bezier(0.2, 0.9, 0.3, 1);
            --ease-hazard: cubic-bezier(0.4, 0, 0.6, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: var(--bg-base); }
        body {
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 12.5px;
            font-weight: 400;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; overflow: hidden; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px var(--s-4); border-bottom: 1px solid var(--border-hairline);
            background: var(--bg-base); flex-shrink: 0; gap: var(--s-3);
            flex-wrap: nowrap; z-index: 10;
        }
        .topbar-left { display: flex; align-items: center; gap: var(--s-3); flex-shrink: 0; }
        .brand-logo { display: flex; align-items: center; gap: 6px; }
        .brand-logo svg { width: 22px; height: 22px; flex-shrink: 0; }
        .brand-mark {
            font-family: var(--font-display); font-size: 12px; font-weight: 500;
            letter-spacing: -0.01em; color: var(--text-primary);
            display: flex; align-items: center; gap: 4px;
        }
        .brand-mark .sep { color: var(--text-tertiary); }
        .brand-mark .sub { color: var(--text-tertiary); font-size: 10px; font-weight: 400; }
        .brand-mark .brand-full { font-weight: 600; letter-spacing: 0.02em; color: var(--text-primary); }
        .state-head {
            display: flex; align-items: center; gap: var(--s-2);
            margin-left: var(--s-3); padding-left: var(--s-3);
            border-left: 1px solid var(--border-hairline);
        }
        .status-dot {
            position: relative; display: inline-flex; width: 8px; height: 8px; flex-shrink: 0;
        }
        .status-dot::before {
            content: ""; width: 8px; height: 8px;
            border-radius: var(--r-pill); background: currentColor;
            display: block; transition: background var(--dur-state) var(--ease-state);
        }
        .status-dot.pulse::after {
            content: ""; position: absolute; inset: -2px;
            border-radius: var(--r-pill); background: currentColor;
            animation: pulse-ring var(--dur-hazard) var(--ease-hazard) infinite;
        }
        @keyframes pulse-ring { 0%{ transform:scale(1); opacity:0.5; } 100%{ transform:scale(2.4); opacity:0; } }
        .state-label {
            font-family: var(--font-display); font-size: 14px; font-weight: 500;
            letter-spacing: -0.01em; transition: color var(--dur-state) var(--ease-state);
        }
        .topbar-right { display: flex; align-items: center; gap: var(--s-2); flex-shrink: 0; }
        .season-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 2px 10px; border-radius: var(--r-pill);
            border: 1px solid var(--border-hairline);
            font-family: var(--font-mono); font-size: 9px; font-weight: 600;
            letter-spacing: 0.06em; color: var(--text-tertiary); background: var(--bg-inset);
        }
        .season-badge .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
        .season-badge.spring .dot { background: #2FBF71; }
        .season-badge.summer .dot { background: #4C8CF5; }
        .season-badge.autumn .dot { background: #E8A23D; }
        .season-badge.winter .dot { background: #4E545E; }
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        .colony-container {
            flex: 1; position: relative;
            background: radial-gradient(ellipse at 50% 60%, var(--bg-raised) 0%, var(--bg-base) 100%);
            overflow: hidden;
        }
        .colony-container canvas {
            width: 100% !important; height: 100% !important;
            display: block;
            will-change: transform; /* GPU compositing hint */
        }
        .info-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 4px var(--s-4); border-top: 1px solid var(--border-hairline);
            background: var(--bg-base); flex-shrink: 0;
            font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); z-index: 10;
        }
        .info-bar .stats { display: flex; gap: var(--s-4); }
        .info-bar .stats .stat { display: flex; align-items: center; gap: 4px; }
        .info-bar .stats .stat .val { color: var(--text-secondary); font-weight: 500; }
        .replay-bar {
            display: flex; align-items: center; gap: var(--s-3);
            padding: 4px var(--s-4); border-top: 1px solid var(--border-hairline);
            background: var(--bg-inset); flex-shrink: 0;
        }
        .replay-bar input[type="range"] {
            flex: 1; accent-color: var(--state-verified);
            background: var(--bg-raised); height: 2px;
            border-radius: var(--r-pill); outline: none;
        }
        .replay-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            border-radius: 50%; background: var(--state-verified); cursor: pointer;
        }
        .replay-bar .time-label {
            font-family: var(--font-mono); font-size: 9px;
            color: var(--text-tertiary); min-width: 60px;
        }
        .replay-bar .replay-btn {
            background: transparent; border: 1px solid var(--border-hairline);
            border-radius: var(--r-pill); color: var(--text-secondary);
            padding: 2px 10px; font-family: var(--font-mono); font-size: 9px;
            cursor: pointer; transition: background 200ms ease;
        }
        .replay-bar .replay-btn:hover { background: var(--bg-raised); color: var(--text-primary); }
        .controls {
            position: fixed; bottom: var(--s-3); right: var(--s-3);
            background: var(--bg-overlay); border: 1px solid var(--border-hairline);
            border-radius: 8px; padding: 4px 6px;
            display: flex; gap: 2px; z-index: 50;
            font-family: var(--font-mono); font-size: 9px; flex-wrap: wrap;
            max-width: calc(100vw - var(--s-5));
        }
        .controls button {
            background: transparent; color: var(--text-tertiary);
            border: 1px solid transparent; padding: 3px 7px;
            border-radius: 4px; cursor: pointer;
            font-family: inherit; font-size: inherit;
            transition: background 200ms ease, color 200ms ease;
        }
        .controls button:hover { color: var(--text-primary); background: var(--bg-raised); }
        .controls button.active { color: var(--text-primary); background: var(--bg-raised); border-color: var(--border-hairline); }
        .controls .sep { width: 1px; background: var(--border-hairline); margin: 2px 2px; }
        @media (max-width: 700px) {
            .topbar { flex-wrap: wrap; padding: 4px var(--s-3); }
            .brand-mark .brand-full { display: none; }
            .info-bar .stats { gap: var(--s-2); }
            .info-bar .stats .stat .label { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .status-dot.pulse::after { animation: none; }
            .status-dot::before { transition: none; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <header class="topbar">
        <div class="topbar-left">
            <div class="brand-logo" title="Venture Vision Ubuntu">
                <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
                    <circle cx="35" cy="40" r="16" stroke="#8A9A5B" stroke-width="5" />
                    <circle cx="65" cy="40" r="16" stroke="#CC7722" stroke-width="5" />
                    <circle cx="50" cy="64" r="16" stroke="#E2E3DB" stroke-width="5" />
                </svg>
                <div class="brand-mark">
                    <span class="brand-full">VENTURE VISION UBUNTU</span><span class="sep">/</span><span class="sub">the colony</span>
                </div>
            </div>
            <div class="state-head">
                <span id="state-dot" class="status-dot" style="color: var(--state-idle)"></span>
                <span id="state-label" class="state-label">IDLE</span>
            </div>
        </div>
        <div class="topbar-right">
            <span id="season-badge" class="season-badge spring"><span class="dot"></span> SPRING</span>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);">
                trust: <span id="trust-value" style="color:var(--text-secondary);">0.000</span>
            </span>
        </div>
    </header>
    <div class="main-content">
        <div class="colony-container" id="colony-container">
            <canvas id="colony-canvas"></canvas>
        </div>
    </div>
    <div class="replay-bar">
        <button class="replay-btn" id="replay-play-btn">▶</button>
        <span class="time-label" id="replay-time">00:00</span>
        <input type="range" id="replay-slider" min="0" max="100" value="0" />
        <span class="time-label" id="replay-total">01:00</span>
        <button class="replay-btn" id="replay-reset-btn">⟲</button>
    </div>
    <div class="info-bar">
        <div class="stats">
            <span class="stat"><span class="label">ants</span> <span class="val" id="stat-ants">0</span></span>
            <span class="stat"><span class="label">leaves</span> <span class="val" id="stat-leaves">0</span></span>
            <span class="stat"><span class="label">canopy</span> <span class="val" id="stat-canopy">0</span></span>
            <span class="stat"><span class="label">season</span> <span class="val" id="stat-season">spring</span></span>
        </div>
        <div>
            <span style="font-family:var(--font-mono);font-size:8px;color:var(--text-tertiary);">
                receipts: <span id="stat-receipts">0</span>
            </span>
        </div>
    </div>
</div>
<nav class="controls" aria-label="Kernel state simulator">
    <button data-state="IDLE" class="active">IDLE</button>
    <button data-state="INGESTING">INGEST</button>
    <button data-state="ATTESTING">ATTEST</button>
    <button data-state="VERIFYING">VERIFY</button>
    <button data-state="COMMITTING">COMMIT</button>
    <button data-state="SETTLED">SETTLED</button>
    <button data-state="HAZARD">HAZARD</button>
    <div class="sep"></div>
    <button class="auto-btn" id="auto-btn">▶ AUTO</button>
</nav>
<script>
(function() {
    'use strict';

    /* ── State Machine (mirrors lib/trust-runtime/state-machine.ts) ── */
    const STATE_META = {
        IDLE:       { label: 'IDLE',       tone: 'idle',     color: '#4E545E' },
        INGESTING:  { label: 'INGESTING',  tone: 'pending',  color: '#E8A23D' },
        ATTESTING:  { label: 'ATTESTING',  tone: 'pending',  color: '#E8A23D' },
        VERIFYING:  { label: 'VERIFYING',  tone: 'pending',  color: '#E8A23D' },
        COMMITTING: { label: 'COMMITTING', tone: 'pending',  color: '#E8A23D' },
        SETTLED:    { label: 'SETTLED',    tone: 'verified', color: '#2FBF71' },
        HAZARD:     { label: 'HAZARD',     tone: 'hazard',   color: '#E5484D' },
    };
    const STATE_ORDER = ['IDLE','INGESTING','ATTESTING','VERIFYING','COMMITTING','SETTLED','HAZARD'];

    const CASTES = {
        SCOUT:     { label:'scout',     speed:1.0, size:0.6, leaf:false, color:'#6C8A9E' },
        CARRIER:   { label:'carrier',   speed:0.7, size:0.9, leaf:true,  color:'#B8C8D4' },
        VERIFIER:  { label:'verifier',  speed:0.3, size:0.8, leaf:false, color:'#E8A23D' },
        ARCHIVIST: { label:'archivist', speed:0.5, size:0.7, leaf:true,  color:'#2FBF71' },
        SENTINEL:  { label:'sentinel',  speed:0.4, size:0.7, leaf:false, color:'#E5484D' },
    };

    /* ── State ── */
    let state = 'IDLE', seq = 0, trust = 0, season = 'spring';
    let ants = [], canopy = [], receipts = [], antId = 0;
    let autoTimer = null, replayHistory = [], replayInterval = null;
    let animFrame = null, recordInterval = null;
    let resizeTimer = null;
    let reducedMotion = false;

    const $ = document.getElementById.bind(document);
    const stateDot = $('state-dot'), stateLabel = $('state-label');
    const trustDisplay = $('trust-value'), seasonBadge = $('season-badge');
    const statAnts = $('stat-ants'), statLeaves = $('stat-leaves');
    const statCanopy = $('stat-canopy'), statSeason = $('stat-season');
    const statReceipts = $('stat-receipts');
    const replaySlider = $('replay-slider'), replayTime = $('replay-time');
    const replayTotal = $('replay-total'), replayPlayBtn = $('replay-play-btn');
    const replayResetBtn = $('replay-reset-btn');

    /* ── Season ── */
    function getSeason(t, s) {
        if (s === 'HAZARD') return 'winter';
        if (s === 'IDLE' || t < 0.3) return 'spring';
        if (t < 0.6) return 'summer';
        if (t < 0.85) return 'autumn';
        return 'summer';
    }
    function getSeasonColor(s) {
        return { spring:'#2FBF71', summer:'#4C8CF5', autumn:'#E8A23D', winter:'#4E545E' }[s] || '#2FBF71';
    }
    function updateSeason() {
        const ns = getSeason(trust, state);
        if (ns !== season) {
            season = ns;
            seasonBadge.className = 'season-badge ' + season;
            seasonBadge.innerHTML = '<span class="dot"></span> ' + season.toUpperCase();
            statSeason.textContent = season;
        }
    }

    /* ── Ant Factory ── */
    function createAnt(caste, angle, radius) {
        const c = CASTES[caste];
        return {
            id: antId++, caste, angle: angle||0, radius: radius||(0.85+Math.random()*0.1),
            speed: c.speed*(0.85+Math.random()*0.3), size: c.size*(0.85+Math.random()*0.3),
            leaf: c.leaf, color: c.color,
            stage: 'approaching', leafColor: '#5C8A52', leafAlpha: 1,
            gateHold: 0, legPhase: Math.random()*Math.PI*2,
            patrolAngle: Math.random()*Math.PI*2, dead: false,
        };
    }
    function spawnScout() {
        const a = createAnt('SCOUT', Math.random()*Math.PI*2, 0.7+Math.random()*0.2);
        a.stage = 'scouting'; return a;
    }
    function spawnCarrier(angle) {
        const a = createAnt('CARRIER', angle, 0.88+Math.random()*0.06);
        a.leafColor = Math.random()>0.3?'#5C8A52':'#8A9A5B'; return a;
    }
    function spawnVerifier() {
        const a = createAnt('VERIFIER', Math.random()*Math.PI*2, 0.5+Math.random()*0.08);
        a.stage = 'verifying'; a.radius = 0.5+Math.random()*0.05; return a;
    }
    function spawnArchivist(angle) {
        const a = createAnt('ARCHIVIST', angle, 0.3+Math.random()*0.1);
        a.stage = 'archiving'; a.leafColor = '#2FBF71'; return a;
    }
    function spawnSentinel(angle) {
        const a = createAnt('SENTINEL', angle, 0.92+Math.random()*0.03);
        a.stage = 'patrolling'; a.patrolAngle = angle; return a;
    }

    /* ── Spawn Rates ── */
    function getSpawnRates() {
        const b = { scout:{p:0.04,cap:6}, carrier:{p:0.06,cap:15}, verifier:{p:0.02,cap:4}, archivist:{p:0.015,cap:6}, sentinel:{p:0.01,cap:4} };
        switch (state) {
            case 'IDLE':       b.scout.p=0.01; b.scout.cap=2; b.carrier.p=0.005; b.carrier.cap=2; b.sentinel.p=0.02; b.sentinel.cap=3; break;
            case 'INGESTING':  b.scout.p=0.06; b.scout.cap=8; b.carrier.p=0.10; b.carrier.cap=20; b.sentinel.p=0.005; break;
            case 'ATTESTING':  b.scout.p=0.02; b.scout.cap=4; b.carrier.p=0.03; b.carrier.cap=10; b.verifier.p=0.04; b.verifier.cap=8; b.sentinel.p=0.02; b.sentinel.cap=6; break;
            case 'VERIFYING':  b.verifier.p=0.06; b.verifier.cap=10; b.carrier.p=0.04; b.carrier.cap=12; break;
            case 'COMMITTING': b.archivist.p=0.04; b.archivist.cap=10; b.carrier.p=0.02; break;
            case 'SETTLED':    b.scout.p=0.01; b.scout.cap=2; b.carrier.p=0.01; b.carrier.cap=4; b.archivist.p=0.02; b.archivist.cap=6; b.sentinel.p=0.01; b.sentinel.cap=3; break;
            case 'HAZARD':     b.scout.p=0; b.carrier.p=0; b.verifier.p=0; b.archivist.p=0; b.sentinel.p=0.08; b.sentinel.cap=12; break;
        }
        if (trust > 0.8)  { b.archivist.p *= 1.5; b.sentinel.p *= 0.5; }
        if (trust < 0.3)  { b.sentinel.p *= 2; b.archivist.p *= 0.5; }
        return b;
    }

    /* ── Event / Snapshot Builder (deterministic) ── */
    function buildSnapshot(st, sq) {
        const isH = st === 'HAZARD', isS = st === 'SETTLED', isI = st === 'IDLE';
        const ep = {IDLE:'000000000000',INGESTING:'a3f19c0b7e24',ATTESTING:'8b2e4d91fa07',VERIFYING:'c7d2f10a93b8',COMMITTING:'e4a81b3c6d5f',SETTLED:'f9e2d7c4b1a0',HAZARD:'deadbeef0000'}[st]||'ffffffffffff';
        const decisions = [
            {passed:!isH},{passed:!isH},{passed:!isH},{passed:isS||(!isH&&!isI)},{passed:true}
        ];
        const passing = decisions.filter(d=>d.passed).length;
        return { trust: isI ? 0 : +(passing/5).toFixed(4) };
    }

    function emitEvent(newState) {
        seq++;
        state = newState;
        const m = STATE_META[state];
        const isH = state === 'HAZARD', isS = state === 'SETTLED', isI = state === 'IDLE';
        trust = Math.max(0, Math.min(1, trust + (isH ? -0.2 : isS ? 0.05 : isI ? 0 : 0.02) + (Math.random()-0.5)*0.01));
        trust = Math.round(trust * 10000) / 10000;
        updateSeason();
        stateDot.style.color = m.color;
        stateDot.classList.toggle('pulse', isH);
        stateLabel.textContent = m.label;
        stateLabel.style.color = m.color;
        trustDisplay.textContent = trust.toFixed(4);
        trustDisplay.style.color = m.color;
        if (!isI && !isH) {
            receipts.push({ seq, state, trust, timestamp: new Date().toISOString() });
            if (receipts.length > 200) receipts.shift();
            statReceipts.textContent = receipts.length;
        }
        statAnts.textContent = ants.length;
        statCanopy.textContent = canopy.length;
        document.querySelectorAll('.controls button[data-state]').forEach(b =>
            b.classList.toggle('active', b.dataset.state === state));
        recordSnapshot();
    }

    /* ── Colony Update ── */
    function updateColony() {
        const r = getSpawnRates();
        const c = c => ants.filter(a => a.caste === c).length;
        if (c('SCOUT') < r.scout.cap && Math.random() < r.scout.p) ants.push(spawnScout());
        if (c('CARRIER') < r.carrier.cap && Math.random() < r.carrier.p) ants.push(spawnCarrier(Math.random()*Math.PI*2));
        if (c('VERIFIER') < r.verifier.cap && Math.random() < r.verifier.p) ants.push(spawnVerifier());
        if (c('ARCHIVIST') < r.archivist.cap && Math.random() < r.archivist.p) ants.push(spawnArchivist(Math.random()*Math.PI*2));
        if (c('SENTINEL') < r.sentinel.cap && Math.random() < r.sentinel.p) ants.push(spawnSentinel(Math.random()*Math.PI*2));

        const stepScale = reducedMotion ? 0.25 : 1;
        for (let i = 0; i < ants.length; i++) {
            const a = ants[i];
            a.legPhase += 0.35 * stepScale;
            switch (a.caste) {
                case 'SCOUT':
                    a.angle += a.speed * 0.005 * stepScale;
                    a.radius += Math.sin(a.angle * 3) * 0.001 * stepScale;
                    a.radius = Math.max(0.6, Math.min(0.9, a.radius));
                    if (Math.random() < 0.001 && state !== 'IDLE' && state !== 'HAZARD')
                        ants.push(spawnCarrier(a.angle));
                    break;
                case 'CARRIER':
                    if (a.stage === 'approaching') {
                        a.radius -= a.speed * 0.003 * stepScale;
                        if (a.radius <= 0.56) { a.radius = 0.56; a.stage = 'atGate'; a.leafColor = '#E8A23D'; a.gateHold = 20+Math.floor(Math.random()*15); }
                    } else if (a.stage === 'atGate') {
                        a.gateHold -= 1 * stepScale;
                        if (a.gateHold <= 0) {
                            if (Math.random() > (trust*0.9+0.1) || state === 'HAZARD') { a.stage = 'rejected'; a.leafColor = '#5A6068'; }
                            else { a.stage = 'verified'; a.leafColor = '#2FBF71'; if (Math.random()<0.4 && state!=='HAZARD') ants.push(spawnArchivist(a.angle)); }
                        }
                    } else if (a.stage === 'verified') {
                        a.radius -= a.speed * 0.004 * stepScale;
                        if (a.radius <= 0.2) {
                            canopy.push({ angle:Math.random()*Math.PI*2, dist:Math.random(), r:1.2+Math.random()*1.8 });
                            if (canopy.length > 300) canopy.shift();
                            a.dead = true; statCanopy.textContent = canopy.length;
                        }
                    } else if (a.stage === 'rejected') {
                        a.radius += a.speed * 0.004 * stepScale; a.leafAlpha -= 0.02 * stepScale;
                        if (a.leafAlpha <= 0 || a.radius >= 0.95) a.dead = true;
                    }
                    break;
                case 'VERIFIER':
                    a.angle += 0.005 * stepScale;
                    a.radius = 0.5 + Math.sin(a.angle*2)*0.04;
                    break;
                case 'ARCHIVIST':
                    if (a.stage === 'archiving') {
                        a.radius -= a.speed * 0.003 * stepScale;
                        if (a.radius <= 0.2) {
                            canopy.push({ angle:Math.random()*Math.PI*2, dist:Math.random(), r:1.0+Math.random()*1.5 });
                            if (canopy.length > 300) canopy.shift();
                            a.dead = true; statCanopy.textContent = canopy.length;
                        }
                    }
                    break;
                case 'SENTINEL':
                    a.patrolAngle += a.speed * 0.004 * stepScale;
                    a.angle = a.patrolAngle; a.radius = 0.92 + Math.sin(a.patrolAngle*2)*0.02;
                    a.color = state === 'HAZARD' ? '#E5484D' : CASTES.SENTINEL.color;
                    break;
            }
        }
        ants = ants.filter(a => !a.dead);
        statAnts.textContent = ants.length;
        statLeaves.textContent = ants.filter(a => a.leaf).length;
    }

    /* ── Drawing (canvas) ── */
    let drawCache = { season: '', trust: 0, state: '', canopyLen: 0 };

    function drawColony() {
        const cvs = document.getElementById('colony-canvas');
        const ctx = cvs.getContext('2d');
        const rect = cvs.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width, rect.height);
        if (size <= 10) return;
        cvs.width = size*2; cvs.height = size*2;
        cvs.style.width = size+'px'; cvs.style.height = size+'px';

        const W=cvs.width, H=cvs.height, cx=W/2, cy=H/2, R=W*0.42;
        ctx.clearRect(0,0,W,H);

        const sC = getSeasonColor(season);
        // Season glow (cached if season hasn't changed)
        const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.1);
        g.addColorStop(0, sC+'08'); g.addColorStop(0.7,'transparent');
        ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

        // Canopy leaves — use Date.now() once, not per leaf
        const now = Date.now();
        const spread = Math.min(0.35, canopy.length*0.0008);
        for (let i = 0; i < canopy.length; i++) {
            const l = canopy[i];
            const d = l.dist * spread * R;
            const lx = cx + Math.cos(l.angle)*d, ly = cy + Math.sin(l.angle)*d*0.7 - spread*R*0.2;
            ctx.globalAlpha = 0.7 + 0.2*Math.sin(l.angle*2+now*0.0005);
            ctx.fillStyle = '#2FBF71';
            ctx.beginPath(); ctx.ellipse(lx,ly,l.r*0.6,l.r*0.4,l.angle,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Breathing kernel
        const breathe = 0.85+0.15*Math.sin(now*0.001*(1+trust*0.5));
        const kR = R*0.12*breathe, kC = (STATE_META[state]||STATE_META.IDLE).color;
        const gl = ctx.createRadialGradient(cx,cy,0,cx,cy,kR*4);
        gl.addColorStop(0, kC+'30'); gl.addColorStop(0.5, kC+'10'); gl.addColorStop(1,'transparent');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx,cy,kR*4,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx,cy,kR*0.8,0,Math.PI*2); ctx.fillStyle = kC; ctx.fill();
        ctx.beginPath(); ctx.arc(cx,cy,kR*1.2,0,Math.PI*2); ctx.strokeStyle = kC+'60'; ctx.lineWidth=1.5; ctx.stroke();

        // Gate ring
        ctx.beginPath(); ctx.arc(cx,cy,0.56*R,0,Math.PI*2);
        ctx.strokeStyle='rgba(232,162,61,0.20)'; ctx.setLineDash([3,8]); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);

        // Ants
        for (let i = 0; i < ants.length; i++) {
            const a = ants[i];
            const x=cx+Math.cos(a.angle)*a.radius*R, y=cy+Math.sin(a.angle)*a.radius*R;
            const sc = a.size*0.7, color = (a.caste==='SENTINEL'&&state==='HAZARD')?'#E5484D':a.color;
            ctx.save(); ctx.translate(x,y); ctx.rotate(a.angle+Math.PI/2); ctx.scale(sc,sc);
            ctx.fillStyle=color; ctx.strokeStyle=color; ctx.lineWidth=0.5;
            ctx.beginPath(); ctx.ellipse(-2.5,0,1.8,1.2,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(-0.3,0,1,0.8,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(1.6,0,0.8,0,Math.PI*2); ctx.fill();
            for(let j=-1;j<=1;j++) {
                const lp=Math.sin(a.legPhase+j*1.3)*0.6;
                ctx.beginPath(); ctx.moveTo(j*0.9-0.3,0); ctx.lineTo(j*0.9-0.3+lp,1.8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(j*0.9-0.3,0); ctx.lineTo(j*0.9-0.3-lp,-1.8); ctx.stroke();
            }
            ctx.beginPath(); ctx.moveTo(2.2,-0.3); ctx.lineTo(3,-1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(2.2,0.3); ctx.lineTo(3,1); ctx.stroke();
            if (a.leaf && a.stage !== 'rejected') {
                ctx.save(); ctx.rotate(-0.2); ctx.translate(0,-1.8);
                ctx.fillStyle = a.leafColor; ctx.globalAlpha = a.leafAlpha;
                ctx.beginPath(); ctx.moveTo(0,-2); ctx.quadraticCurveTo(1.2,-0.5,0,2);
                ctx.quadraticCurveTo(-1.2,-0.5,0,-2); ctx.fill();
                ctx.restore(); ctx.globalAlpha = 1;
            }
            if (a.caste==='SENTINEL'&&state==='HAZARD') {
                ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fillStyle='#E5484D20'; ctx.fill();
            }
            ctx.restore();
        }
        ctx.fillStyle=sC+'30'; ctx.font=R*0.04+'px '+window.getComputedStyle(document.body).fontFamily;
        ctx.textAlign='center'; ctx.fillText(season.toUpperCase(),cx,R*0.06);
        ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.font=R*0.025+'px monospace'; ctx.textAlign='left';
        ctx.fillText(ants.length+' ants | '+canopy.length+' leaves | trust '+trust.toFixed(3),R*0.05,H-R*0.03);
    }

    /* ── Animation Loop ── */
    function animate() {
        updateColony();
        drawColony();
        animFrame = requestAnimationFrame(animate);
    }

    /* ── Replay ── */
    function recordSnapshot() {
        replayHistory.push({ ants:ants.map(a=>({...a})), leaves:canopy.map(l=>({...l})), trust, state, season, receipts:receipts.length, time:Date.now() });
        if (replayHistory.length > 200) replayHistory.shift();
        replaySlider.max = Math.max(100, replayHistory.length-1);
    }

    function replayTo(idx) {
        if (idx < 0 || idx >= replayHistory.length) return;
        const snap = replayHistory[idx];
        ants = snap.ants.map(a=>({...a})); canopy = snap.leaves.map(l=>({...l}));
        trust = snap.trust; state = snap.state; season = snap.season;
        const m = STATE_META[state];
        stateDot.style.color = m.color; stateLabel.textContent = m.label; stateLabel.style.color = m.color;
        trustDisplay.textContent = trust.toFixed(4); trustDisplay.style.color = m.color;
        statCanopy.textContent = canopy.length; statReceipts.textContent = snap.receipts;
        seasonBadge.className = 'season-badge ' + season;
        seasonBadge.innerHTML = '<span class="dot"></span> ' + season.toUpperCase();
        statSeason.textContent = season;
        replayTime.textContent = new Date(snap.time).toLocaleTimeString().slice(0,5);
    }

    /* ── Cleanup ── */
    function cleanup() {
        if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        if (replayInterval) { clearInterval(replayInterval); replayInterval = null; }
        if (recordInterval) { clearInterval(recordInterval); recordInterval = null; }
        if (resizeTimer) { clearTimeout(resizeTimer); resizeTimer = null; }
    }

    /* ── Init ── */
    reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Listen for changes to reduced-motion preference
    const motionMedia = window.matchMedia('(prefers-reduced-motion: reduce)');
    const motionListener = function(e) { reducedMotion = e.matches; };
    motionMedia.addEventListener('change', motionListener);

    for (let i=0;i<8;i++) ants.push(spawnScout());
    for (let i=0;i<4;i++) ants.push(spawnSentinel(Math.random()*Math.PI*2));
    updateSeason();
    trustDisplay.textContent = '0.0000';
    replayTotal.textContent = '01:00';
    animate();
    const snapTimer = setTimeout(() => recordSnapshot(), 100);
    recordInterval = setInterval(recordSnapshot, 2000);

    /* ── Controls ── */
    document.querySelectorAll('.controls button[data-state]').forEach(b => {
        b.addEventListener('click', function() {
            if (autoTimer) { clearInterval(autoTimer); autoTimer = null; document.getElementById('auto-btn').textContent = '▶ AUTO'; }
            emitEvent(this.dataset.state);
        });
    });
    document.getElementById('auto-btn').addEventListener('click', function() {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; this.textContent = '▶ AUTO'; return; }
        let i=0;
        autoTimer = setInterval(() => { emitEvent(STATE_ORDER[i%STATE_ORDER.length]); i++; }, 1800);
        this.textContent = '■ STOP';
    });

    replayPlayBtn.addEventListener('click', function() {
        if (replayInterval) { clearInterval(replayInterval); replayInterval=null; this.textContent='▶'; return; }
        this.textContent='⏸'; let idx=parseInt(replaySlider.value);
        replayInterval = setInterval(() => { idx++; if(idx>=replayHistory.length) idx=0; replaySlider.value=idx; replayTo(idx); },100);
    });
    replaySlider.addEventListener('input', function() {
        if(replayInterval){clearInterval(replayInterval);replayInterval=null;replayPlayBtn.textContent='▶';}
        replayTo(parseInt(this.value));
    });
    replayResetBtn.addEventListener('click', function() {
        if(replayInterval){clearInterval(replayInterval);replayInterval=null;replayPlayBtn.textContent='▶';}
        replaySlider.value=0; replayTo(0);
    });

    window.addEventListener('resize', () => {
        if(resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { const c=$('colony-canvas'); const r=c.parentElement.getBoundingClientRect(); const s=Math.min(r.width,r.height); if(s>10){c.width=s*2;c.height=s*2;c.style.width=s+'px';c.style.height=s+'px';} },100);
    });

    /* ── Page lifecycle cleanup ── */
    window.addEventListener('beforeunload', cleanup);
    window.addEventListener('pagehide', cleanup);

    console.log('VVU Colony — Trust Operating Model');
    console.log('Castes: Scouts, Carriers, Verifiers, Archivists, Sentinels');
    console.log('Seasons: Spring -> Summer -> Autumn -> Winter');
    console.log('Kernel breathes with trust');
})();
</script>
