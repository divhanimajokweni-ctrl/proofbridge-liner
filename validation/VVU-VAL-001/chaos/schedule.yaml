# VVU-VAL-001 · Failure-Injection Schedule (Gate-Mapped)
#
# Published verbatim before T=0. Each phase maps directly to a documented
# Hard Failure gate or chaos-engineering level, so the test exercises each
# claim in the Epistemic Runtime specification.
#
# The chaos driver (inject-*.sh scripts) reads this file and applies the
# injections at the scheduled hour. Validation events are versioned
# independently from software releases: VAL-001, VAL-002, VAL-003, etc.

validation_event: VAL-001
protocol_version: "1.1"
software_release: "to-be-set-at-freeze"   # e.g. v1.0.0 — independent of VAL-001
commit_hash: "TO_BE_SET_AT_FREEZE"        # set by freeze-build.sh
image_tag: "TO_BE_SET_AT_FREEZE"          # e.g. vvu/epistemic-runtime:VAL-001
image_digest: "TO_BE_SET_AT_FREEZE"       # sha256:... — set by freeze-build.sh

total_hours: 72

phases:
  - id: P1
    name: "Nominal Load"
    hours: [0, 12]
    gate: "Baseline"
    script: null  # no injection — baseline traffic only
    objective: "Establish baseline behaviour under normal telemetry traffic."
    injected:
      type: "none"
      rate_per_s: 50
    expected:
      circuit_breaker: ["NORMAL"]
      throughput_pct: 100
      rejected_facts: 0
    pass_criteria:
      - "Circuit Breaker remains NORMAL for the full 12 hours"
      - "100% throughput; zero rejected Facts"
      - "MMR root progresses monotonically"
      - "Replay checksum matches Fact Log at every hourly checkpoint"
    severity_on_failure: "Critical"

  - id: P2
    name: "Telemetry Flood"
    hours: [12, 24]
    gate: "Acceptance Capacity"
    script: null  # rate flood handled by telemetry-generator env var
    objective: "Verify the acceptance pipeline absorbs a 100× flood without corruption."
    injected:
      type: "rate_flood"
      schedule:
        - { at_hour: 12, multiplier: 10 }
        - { at_hour: 15, multiplier: 25 }
        - { at_hour: 18, multiplier: 50 }
        - { at_hour: 21, multiplier: 100 }
    expected:
      circuit_breaker: ["NORMAL", "DEGRADED"]
      queue_grows: true
      no_corruption: true
    pass_criteria:
      - "Queue absorbs the flood; no Fact corruption"
      - "Circuit Breaker stays NORMAL or DEGRADED only — never FAIL-CLOSED"
      - "At 100× flood, p99 latency may rise but no Fact is lost"
    severity_on_failure: "Major"

  - id: P3
    name: "Network Chaos"
    hours: [24, 36]
    gate: "HLC Ordering"
    script: "inject-network.sh"
    objective: "Verify replay stays deterministic under packet loss, latency, and duplication."
    injected:
      type: "network"
      schedule:
        - { at_hour: 24, packet_loss_pct: 5,  latency_ms: 50,   dup_pct: 1 }
        - { at_hour: 27, packet_loss_pct: 15, latency_ms: 400,  dup_pct: 3 }
        - { at_hour: 30, packet_loss_pct: 25, latency_ms: 1000, dup_pct: 5 }
        - { at_hour: 33, packet_loss_pct: 40, latency_ms: 2000, dup_pct: 8 }
    expected:
      replay_deterministic: true
      hlc_order_preserved: true
    pass_criteria:
      - "Replay checksum identical before and after each network-injection step"
      - "HLC partial order preserved — no Fact received before its causal predecessor"
      - "On merge, no conflicts observed"
    severity_on_failure: "Critical"

  - id: P4
    name: "Storage Pressure"
    hours: [36, 48]
    gate: "Append-Only Integrity"
    script: "inject-storage.sh"
    objective: "Verify graceful degradation under disk fill and IO throttle."
    injected:
      type: "storage"
      schedule:
        - { at_hour: 36, disk_fill_pct: 70, io_throttle_iops: 5000 }
        - { at_hour: 39, disk_fill_pct: 80, io_throttle_iops: 2000 }
        - { at_hour: 42, disk_fill_pct: 90, io_throttle_iops: 500 }
        - { at_hour: 45, disk_fill_pct: 95, io_throttle_iops: 100 }
    expected:
      circuit_breaker: ["DEGRADED", "NORMAL"]
      fact_log_append_only: true
    pass_criteria:
      - "Fact Log remains append-only — no Fact modified or deleted"
      - "MMR root remains valid at every checkpoint"
      - "Circuit Breaker transitions DEGRADED under pressure, recovers NORMAL when pressure eases"
    severity_on_failure: "Critical"

  - id: P5
    name: "Node Failure"
    hours: [48, 60]
    gate: "Recovery"
    script: null  # handled by the chaos driver directly (kubectl delete pod)
    objective: "Verify pods restart and no Fact is lost under random process kills."
    injected:
      type: "pod_kill"
      targets: ["runtime", "nats", "worker", "api", "scheduler"]
      cadence_minutes: 15
      random: true
    expected:
      pods_restart: true
      no_fact_loss: true
      cb_recovers: true
    pass_criteria:
      - "Killed pods restart within 60s"
      - "No Fact lost across any kill cycle"
      - "Circuit Breaker recovers DEGRADED → NORMAL after each kill"
    severity_on_failure: "Major"

  - id: P6
    name: "Security Injection"
    hours: [60, 66]
    gate: "HF-001 / HF-002 / HF-005"
    script: "inject-security.sh"
    objective: "Verify every spoofed/malformed payload is rejected at the documented gate."
    injected:
      type: "security"
      injections:
        - { gate: "HF-001", kind: "bad_signature",          rate_per_s: 20 }
        - { gate: "HF-001", kind: "spoofed_telemetry",      rate_per_s: 10 }
        - { gate: "HF-002", kind: "bad_zk_proof",           rate_per_s: 5 }
        - { gate: "HF-002", kind: "fake_hash",              rate_per_s: 5 }
        - { gate: "HF-005", kind: "contradictory_telemetry", rate_per_s: 3 }
        - { gate: "HF-005", kind: "clock_skew",             skew_s: 30 }
        - { kind: "replay_attack",    rate_per_s: 8 }
        - { kind: "duplicate_ids",    rate_per_s: 4 }
    expected:
      every_spoof_rejected: true
      bad_zk_rejected: true
      contradictory_halts: true
    pass_criteria:
      - "HF-001: every bad-signature / spoofed payload quarantined at Evidence Compiler Pass 2"
      - "HF-002: every bad ZK proof rejected by GovernanceAnchor.sol; no WRT minted"
      - "HF-005: contradictory telemetry halts inference (TRIP verdict), requests human-in-the-loop"
      - "Replay attacks and duplicate IDs rejected — none accepted into the Fact Log"
    severity_on_failure: "Critical"

  - id: P7
    name: "Partition + Recovery"
    hours: [66, 72]
    gate: "LVL-17 (72h Blackout)"
    script: "inject-partition.sh"
    objective: "Verify deterministic HLC merge after a 6-hour cluster partition."
    injected:
      type: "partition"
      schedule:
        - { at_hour: 66, partition: true,  continue_producing: true }
        - { at_hour: 71, partition: false, merge: true }
    expected:
      deterministic_merge: true
      zero_corruption: true
      replay_identical: true
      mmr_identical: true
    pass_criteria:
      - "During partition, isolated Facts queue in NATS durable queue"
      - "On reconnect, HLC merge produces zero conflicts observed, zero data loss observed"
      - "Replay of merged log identical to live log"
      - "MMR root identical whether computed from live or replayed log"
    severity_on_failure: "Critical"
