# VVU-VAL-001 · Outreach Namespace (Layer 2 — KILLABLE)
#
# The outreach engine consumes signed milestone events from the evidence bus.
# This namespace is KILLABLE — if it crashes or is deleted, the 72-hour
# validation continues unaffected. The evidence bundles still archive hourly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outreach-engine
  namespace: outreach
  labels: { app: outreach-engine, killable: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: outreach-engine } }
  template:
    metadata: { labels: { app: outreach-engine, killable: "true" } }
    spec:
      containers:
        - name: outreach
          image: vvu/outreach-engine:VAL-001
          env:
            - { name: EVIDENCE_BUS, value: "nats://nats.vvu-runtime:4222" }
            - { name: REGISTRY_DIR, value: "/registry" }
            - { name: STAGES_FILE, value: "/registry/stages.yaml" }
          volumeMounts:
            - { name: registry, mountPath: /registry, readOnly: true }
      volumes:
        - { name: registry, configMap: { name: outreach-registry } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: outreach-registry, namespace: outreach }
data:
  milestones.yaml: |
    # see validation/VVU-VAL-001/outreach/milestones.yaml
  recipients.yaml: |
    # see validation/VVU-VAL-001/outreach/recipients.yaml
  stages.yaml: |
    # see validation/VVU-VAL-001/outreach/stages.yaml
