# VVU-VAL-001 · Release Workflow
# At H72: assembles the evidence package and publishes it as a GitHub Release
# associated with the frozen Git tag (VAL-001). Also triggers the staged
# outreach sequence (Layer 2, separate workflow).
name: VVU-VAL-001 Release

on:
  workflow_dispatch:
    inputs:
      milestone: { description: "Milestone ID (e.g. M72)", required: true, type: string }
  repository_dispatch:
    types: [vvu-val-milestone]

permissions: { contents: write }

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Assemble evidence package
        run: |
          chmod +x validation/VVU-VAL-001/evidence/archive.sh
          bash validation/VVU-VAL-001/evidence/archive.sh

      - name: Publish GitHub Release
        run: |
          chmod +x validation/VVU-VAL-001/evidence/archive.sh
          bash validation/VVU-VAL-001/evidence/archive.sh --release

      - name: Trigger outreach engine (Layer 2)
        run: |
          echo "Triggering outreach engine for milestone ${{ github.event.inputs.milestone }}"
          # The outreach engine is a SEPARATE workflow that enforces staged release.
          # It is killable and does not affect the validation.
          gh workflow run validation/VVU-VAL-001/github/outreach-engine.yml \
            -f milestone="${{ github.event.inputs.milestone }}" || \
            echo "outreach engine not triggered (may be disabled — validation unaffected)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reminder — long-term archival
        run: |
          echo "Next step: archive the evidence package to Zenodo/immutable S3 per §6.2"
          echo "of the protocol. Record the Zenodo DOI in the GitHub Release notes."
