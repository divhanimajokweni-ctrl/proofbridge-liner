name: antstack
title: Ant Stack — Colony vs Anteater
summary: Realtime asymmetric tactical survival game for Ubuntu Pools
description: |
  🐜 Defend your colony or devour as the anteater.

  Ant Stack is a realtime asymmetric multiplayer game where a colony of ants defends against a single predatory anteater. Built for Ubuntu Pools and Ubuntu Games with server-authoritative matches, LAN discovery, and full audit logging.

  Features:
  • 12x12 tactical grid with heatmap telemetry
  • 3-6 colony players vs 1 anteater
  • TrustFactor matchmaking
  • Real-time WebSocket protocol
  • Full audit logging for dispute resolution
  • LAN mode via Avahi/mDNS discovery

