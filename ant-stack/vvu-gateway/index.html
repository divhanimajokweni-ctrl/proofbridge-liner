<div class="gateway-wrapper">
    <div class="security-banner" id="teeStatus">
        <span class="shield">🛡</span>
        <span class="label">TEE Attestation</span>
        <span class="status" id="teeMode">Software Attested</span>
        <span class="pending" id="teeHardware">· Hardware Pending</span>
    </div>

    <div class="status-panel" id="proofbridgeStatus">
        <div class="status-item">
            <span class="dot-indicator" id="dot-proofbridge"></span>
            <span class="name">ProofBridge</span>
            <span class="value" id="val-proofbridge">--</span>
        </div>
        <div class="status-item">
            <span class="dot-indicator" id="dot-circuit"></span>
            <span class="name">Circuit Breaker</span>
            <span class="value" id="val-circuit">--</span>
        </div>
    </div>
</div>

<script>
async function fetchTEEStatus() {
    const response = await fetch('/api/attestation');
    const data = await response.json();
    document.getElementById('teeMode').textContent =
        data.mode === 'hardware' ? 'Hardware Attested ✓' : 'Software Attested';
    document.getElementById('teeHardware').textContent =
        data.mode === 'hardware' ? '· ✓ Fully Verified' : '· Hardware Pending';
}

async function fetchProofBridgeStatus() {
    const response = await fetch('/api/proofbridge/health');
    const data = await response.json();
    const dot = document.getElementById('dot-proofbridge');
    const val = document.getElementById('val-proofbridge');
    dot.className = 'dot-indicator ' + (data.status === 'healthy' ? 'online' : 'offline');
    val.textContent = data.status === 'healthy' ? 'ONLINE' : 'OFFLINE';
}

async function fetchCircuitStatus() {
    const response = await fetch('/api/circuit/status');
    const data = await response.json();
    const dot = document.getElementById('dot-circuit');
    const val = document.getElementById('val-circuit');
    dot.className = 'dot-indicator ' + (data.status === 'closed' ? 'online' : 'offline');
    val.textContent = data.status === 'closed' ? 'CLOSED' : 'OPEN';
}

setInterval(() => {
    fetchTEEStatus();
    fetchProofBridgeStatus();
    fetchCircuitStatus();
}, 5000);
</script>
