server {
    listen 80;
    server_name antstack.vvu.africa;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name antstack.vvu.africa;

    ssl_certificate /etc/ssl/certs/antstack.crt;
    ssl_certificate_key /etc/ssl/private/antstack.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/antstack-access.log;
    error_log /var/log/nginx/antstack-error.log;

    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /match/ {
        proxy_pass http://localhost:8080/match/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /static/ {
        alias /var/www/antstack/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
