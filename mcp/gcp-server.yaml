name: gcp-mcp-server
version: "1.0"
transport: stdio
description: "GCP Gemini + Terraform + Datadog MCP for VVU"

env:
  GOOGLE_APPLICATION_CREDENTIALS: "./auth/gcp.json"
  GCP_PROJECT_ID: "${GCP_PROJECT_ID}"
  DATADOG_API_KEY: "${DATADOG_API_KEY}"
  DATADOG_APP_KEY: "${DATADOG_APP_KEY}"

tools:
  - name: gcloud_exec
    description: "Run gcloud CLI commands (read-only by default)"
    command: ["gcloud"]
    args:
      allow:
        - "projects"
        - "compute"
        - "container"
        - "iam"
        - "services"
      deny:
        - "projects.delete"

  - name: terraform_exec
    description: "Run terraform plan/apply/destroy (admin-only — use via dedicated terraform MCP server)"
    command: ["terraform"]
    args:
      deny:
        - "destroy"
        - "force-unlock"
        - "import"

  - name: gemini_cli
    description: "Ask Gemini 2.5 Pro for infra reasoning"
    command: ["gemini", "--model=gemini-2.5-pro"]

  - name: datadog_alert
    description: "Create/silence/inspect Datadog monitors"
    command: ["datadog", "monitor"]
