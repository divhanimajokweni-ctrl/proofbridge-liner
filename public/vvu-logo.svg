<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Ring gradients for depth -->
    <linearGradient id="ring-ubuntu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A9A5B"/>
      <stop offset="100%" stop-color="#6B7A3E"/>
    </linearGradient>
    <linearGradient id="ring-trust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC7722"/>
      <stop offset="100%" stop-color="#A85E15"/>
    </linearGradient>
    <linearGradient id="ring-provenance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E3DB"/>
      <stop offset="100%" stop-color="#C4C5BD"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle (dark) -->
  <circle cx="256" cy="256" r="250" fill="#0a0a0f"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Three interlocking trust rings -->
  <g filter="url(#shadow)">
    <!-- Top-left ring: Ubuntu / Community (olive green) -->
    <circle cx="195" cy="210" r="80" stroke="url(#ring-ubuntu)" stroke-width="24" fill="none" opacity="0.9"/>

    <!-- Top-right ring: Trust / Verification (amber/gold) -->
    <circle cx="317" cy="210" r="80" stroke="url(#ring-trust)" stroke-width="24" fill="none" opacity="0.9"/>

    <!-- Bottom ring: Provenance / Transparency (off-white) -->
    <circle cx="256" cy="318" r="80" stroke="url(#ring-provenance)" stroke-width="24" fill="none" opacity="0.9"/>
  </g>

  <!-- Overlap highlights — where rings intersect, show a brighter blend -->
  <!-- Top-left & Top-right overlap -->
  <clipPath id="clip-left">
    <circle cx="195" cy="210" r="80"/>
  </clipPath>
  <clipPath id="clip-right">
    <circle cx="317" cy="210" r="80"/>
  </clipPath>
  <clipPath id="clip-bottom">
    <circle cx="256" cy="318" r="80"/>
  </clipPath>

  <!-- Left ring over right (upper intersection) -->
  <circle cx="195" cy="210" r="80" stroke="#9DAD6A" stroke-width="24" fill="none" clip-path="url(#clip-right)" opacity="0.5"/>

  <!-- Bottom ring over left (lower-left intersection) -->
  <circle cx="256" cy="318" r="80" stroke="#EDEEE6" stroke-width="24" fill="none" clip-path="url(#clip-left)" opacity="0.5"/>

  <!-- Bottom ring over right (lower-right intersection) -->
  <circle cx="256" cy="318" r="80" stroke="#EDEEE6" stroke-width="24" fill="none" clip-path="url(#clip-right)" opacity="0.5"/>

  <!-- Center convergence point — a subtle bright dot where all three rings meet -->
  <circle cx="256" cy="256" r="8" fill="#C9A84C" opacity="0.6"/>
  <circle cx="256" cy="256" r="4" fill="#C9A84C" opacity="0.9"/>

  <!-- VVU text below the rings -->
  <text x="256" y="445" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#E2E3DB" letter-spacing="8">VVU</text>
</svg>
