<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VVU · Intergalactic Stickman + Mod Marketplace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; height: 100vh; width: 100vw; }

    #canvas { display: block; width: 100vw; height: 100vh; background: #020105; }

    #hud-overlay {
      position: absolute; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .hud-title {
      color: #e0d5f0; font-size: 14px; font-weight: bold; letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(189, 0, 255, 0.5);
    }
    .hud-stats { display: flex; gap: 15px; pointer-events: auto; }
    .badge {
      background: rgba(10, 5, 18, 0.75); border: 1px solid #35cdd7;
      padding: 6px 14px; border-radius: 4px; color: #35cdd7; font-size: 12px;
      font-weight: bold; backdrop-filter: blur(8px); cursor: pointer; transition: all 0.2s;
    }
    .badge:hover { background: #35cdd7; color: #0a0512; }
    #badge-state { border-color: #bd00ff; color: #bd00ff; }
    #btn-store { border-color: #ffaa00; color: #ffaa00; }
    #btn-store:hover { background: #ffaa00; color: #0a0512; }
    #btn-refresh { border-color: #39ff14; color: #39ff14; font-size: 11px; }

    #store-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 650px; height: 80vh; max-height: 500px;
      background: rgba(10, 5, 18, 0.95); border: 1px solid #ffaa00;
      border-radius: 8px; padding: 20px; color: #e0d5f0;
      backdrop-filter: blur(12px); z-index: 20; display: none;
      flex-direction: column; box-shadow: 0 0 30px rgba(255, 170, 0, 0.2);
    }
    .store-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px dashed #ffaa00; padding-bottom: 10px; margin-bottom: 15px;
    }
    .store-title { color: #ffaa00; font-weight: bold; font-size: 16px; letter-spacing: 1px; }
    .store-status { color: #35cdd7; font-size: 10px; margin-left: 10px; }
    .store-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px; overflow-y: auto; flex: 1; padding-right: 5px;
    }
    .mod-card {
      background: rgba(25, 14, 42, 0.8); border: 1px solid #35cdd7;
      border-radius: 6px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .mod-title { font-weight: bold; color: #fff; font-size: 13px; margin-bottom: 4px; }
    .mod-author { font-size: 10px; color: #8e979e; margin-bottom: 4px; }
    .mod-category { font-size: 9px; color: #bd00ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .mod-desc { font-size: 11px; color: #c4b8d9; margin-bottom: 12px; line-height: 1.4; }
    .mod-footer { display: flex; justify-content: space-between; align-items: center; }
    .mod-price { font-size: 11px; font-weight: bold; color: #ffaa00; }
    .btn-install {
      background: transparent; border: 1px solid #35cdd7; color: #35cdd7;
      padding: 4px 10px; border-radius: 4px; font-family: inherit; font-size: 10px;
      font-weight: bold; cursor: pointer;
    }
    .btn-install.active { background: #39ff14; border-color: #39ff14; color: #000; }
    .store-loading { color: #8e979e; text-align: center; padding: 40px; font-size: 12px; }
    .store-error { color: #ff4d00; text-align: center; padding: 40px; font-size: 12px; }
  </style>
</head>
<body>

  <div id="hud-overlay">
    <div class="hud-title">VVU // ACCRETION DISK</div>
    <div class="hud-stats">
      <div class="badge" id="hud-matter">MATTER: 100</div>
      <div class="badge" id="badge-state">STATE: ORDINARY</div>
      <div class="badge" id="btn-store">🛒 MOD STORE</div>
      <div class="badge" id="btn-refresh">↻ SYNC</div>
    </div>
  </div>

  <div id="store-modal">
    <div class="store-header">
      <span class="store-title">VVU COMMUNITY STORE & REGISTRY <span class="store-status" id="store-status">— loading…</span></span>
      <span id="close-store" style="cursor:pointer; color:#ff4d00; font-weight:bold;">[CLOSE]</span>
    </div>
    <div class="store-grid" id="store-items-container">
      <div class="store-loading">Fetching mods from /api/store/registry…</div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      W = canvas.width; H = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();

    const MODES = { ORDINARY: 0, CODIFIED: 1, DECODED: 2 };
    const MODE_NAMES = ['ORDINARY', 'CODIFIED', 'DECODED'];
    let currentMode = MODES.ORDINARY;

    const stickman = { x: W * 0.3, y: H * 0.5, vx: 0, vy: 0, angle: 0 };
    let pointer = { x: W / 2, y: H / 2, isDown: false };

    let bullets = [];
    let enemies = [];
    let matterParticles = [];
    let matterScore = 100;

    // Mod capabilities are derived from the fetched store registry.
    // Each mod's "id" maps to a capability flag here once installed.
    const activeMods = {};

    // Store catalog fetched from the backend JSON endpoint
    let storeRegistry = [];

    const platforms = [
      { x: W * 0.25, y: H * 0.7, w: 220, h: 14, requiredMode: MODES.ORDINARY, color: '#ffffff' },
      { x: W * 0.50, y: H * 0.5, w: 200, h: 14, requiredMode: MODES.CODIFIED, color: '#00e5ff' },
      { x: W * 0.75, y: H * 0.3, w: 220, h: 14, requiredMode: MODES.DECODED, color: '#bd00ff' }
    ];

    // ─────────────────────────────────────────────────────────────────────────
    // STORE REGISTRY FETCH — replaces the hardcoded array
    // ─────────────────────────────────────────────────────────────────────────
    async function fetchStoreRegistry() {
      const statusEl = document.getElementById('store-status');
      try {
        statusEl.textContent = '— fetching…';
        const res = await fetch('/api/store/registry');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        storeRegistry = data.mods || [];

        // Preserve installed state across syncs (if the same id exists)
        storeRegistry.forEach(mod => {
          if (activeMods[mod.id] === undefined) {
            activeMods[mod.id] = mod.installed || false;
          }
        });

        statusEl.textContent = `— ${storeRegistry.length} mods loaded`;
        renderStoreUI();
      } catch (err) {
        statusEl.textContent = '— fetch failed';
        document.getElementById('store-items-container').innerHTML =
          `<div class="store-error">Failed to load store: ${err.message}<br><br>Make sure the dev server is running and /api/store/registry is reachable.</div>`;
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#hud-overlay') || e.target.closest('#store-modal')) return;
      pointer.isDown = true; pointer.x = e.clientX; pointer.y = e.clientY;
      shootWeapon();
    });

    window.addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
    window.addEventListener('pointerup', () => { pointer.isDown = false; });

    function shootWeapon() {
      const dx = pointer.x - stickman.x, dy = pointer.y - stickman.y;
      const len = Math.hypot(dx, dy) || 1;

      // Check if the "gravityGrenade" mod is installed
      if (activeMods.gravityGrenade) {
        bullets.push({
          x: stickman.x, y: stickman.y,
          vx: (dx / len) * 450, vy: (dy / len) * 450,
          radius: 12, isGrenade: true, life: 2.5
        });
      } else {
        bullets.push({
          x: stickman.x, y: stickman.y,
          vx: (dx / len) * 750, vy: (dy / len) * 750,
          radius: 4, isGrenade: false, life: 1.5
        });
      }
    }

    document.getElementById('badge-state').addEventListener('click', () => {
      currentMode = (currentMode + 1) % 3;
      const name = MODE_NAMES[currentMode];
      document.getElementById('badge-state').textContent = `STATE: ${name}`;
      document.getElementById('badge-state').style.borderColor = currentMode === MODES.CODIFIED ? '#00e5ff' : currentMode === MODES.DECODED ? '#bd00ff' : '#fff';
      document.getElementById('badge-state').style.color = document.getElementById('badge-state').style.borderColor;
    });

    const storeModal = document.getElementById('store-modal');
    document.getElementById('btn-store').addEventListener('click', () => {
      storeModal.style.display = 'flex';
      if (storeRegistry.length === 0) fetchStoreRegistry();
    });
    document.getElementById('close-store').addEventListener('click', () => {
      storeModal.style.display = 'none';
    });
    document.getElementById('btn-refresh').addEventListener('click', () => {
      fetchStoreRegistry();
    });

    function renderStoreUI() {
      const container = document.getElementById('store-items-container');
      if (storeRegistry.length === 0) {
        container.innerHTML = '<div class="store-loading">No mods in registry yet. Upload via the Dev SDK tab.</div>';
        return;
      }
      container.innerHTML = '';
      storeRegistry.forEach(item => {
        const card = document.createElement('div');
        card.className = 'mod-card';
        const isInstalled = !!activeMods[item.id];
        card.innerHTML = `
          <div>
            <div class="mod-title">${item.title}</div>
            <div class="mod-author">By ${item.author}</div>
            <div class="mod-category">${item.category || 'UNCATEGORIZED'}</div>
            <div class="mod-desc">${item.desc}</div>
          </div>
          <div class="mod-footer">
            <span class="mod-price">${item.price}</span>
            <button class="btn-install ${isInstalled ? 'active' : ''}" onclick="toggleMod('${item.id}')">
              ${isInstalled ? 'ENABLED' : 'ENABLE'}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.toggleMod = function(modId) {
      activeMods[modId] = !activeMods[modId];
      renderStoreUI();
    };

    let lastTime = performance.now();

    function update(dt) {
      const dx = pointer.x - stickman.x, dy = pointer.y - stickman.y;
      const dist = Math.hypot(dx, dy);
      stickman.angle = Math.atan2(dy, dx);

      if (pointer.isDown && dist > 20) {
        const thrust = 450 * dt;
        stickman.vx += Math.cos(stickman.angle) * thrust;
        stickman.vy += Math.sin(stickman.angle) * thrust;

        matterParticles.push({
          x: stickman.x - Math.cos(stickman.angle) * 15,
          y: stickman.y - Math.sin(stickman.angle) * 15,
          vx: -Math.cos(stickman.angle) * 150 + (Math.random() - 0.5) * 50,
          vy: -Math.sin(stickman.angle) * 150 + (Math.random() - 0.5) * 50,
          life: 0.3, color: activeMods.neonSkin ? '#39ff14' : '#00e5ff'
        });
      }

      const bhX = W * 0.5, bhY = H * 0.5;
      const bhDx = bhX - stickman.x, bhDy = bhY - stickman.y;
      const bhDist = Math.hypot(bhDx, bhDy);
      if (bhDist > 80) {
        const gravity = 15000 / bhDist;
        stickman.vx += (bhDx / bhDist) * gravity * dt;
        stickman.vy += (bhDy / bhDist) * gravity * dt;
      }

      stickman.vx *= 0.985; stickman.vy *= 0.985;
      stickman.x += stickman.vx * dt; stickman.y += stickman.vy * dt;

      for (let p of platforms) {
        if (p.requiredMode === currentMode) {
          if (stickman.x > p.x && stickman.x < p.x + p.w &&
              stickman.y + 20 >= p.y && stickman.y - 20 <= p.y + p.h) {
            stickman.vy = -stickman.vy * 0.4;
            stickman.y = p.y - 20;
          }
        }
      }

      // Void Leech mod affects spawn count + speed
      const voidLeech = activeMods.voidLeech;
      if (enemies.length < (voidLeech ? 9 : 4) && Math.random() < 0.02) {
        const angle = Math.random() * Math.PI * 2;
        const spawnDist = Math.max(W, H) * 0.6;
        enemies.push({
          x: bhX + Math.cos(angle) * spawnDist, y: bhY + Math.sin(angle) * spawnDist,
          speed: voidLeech ? 140 : 80, hp: 20, isLeech: voidLeech
        });
      }

      for (let e of enemies) {
        const edx = stickman.x - e.x, edy = stickman.y - e.y;
        const edist = Math.hypot(edx, edy) || 1;
        e.x += (edx / edist) * e.speed * dt;
        e.y += (edy / edist) * e.speed * dt;
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < (b.isGrenade ? 35 : 20)) {
            e.hp -= b.isGrenade ? 40 : 15;
            if (!b.isGrenade) b.life = 0;
            if (e.hp <= 0) {
              matterScore += 20;
              document.getElementById('hud-matter').textContent = `MATTER: ${matterScore}`;
              enemies.splice(j, 1);
            }
            break;
          }
        }
        if (b.life <= 0) bullets.splice(i, 1);
      }

      for (let i = matterParticles.length - 1; i >= 0; i--) {
        matterParticles[i].x += matterParticles[i].vx * dt;
        matterParticles[i].y += matterParticles[i].vy * dt;
        matterParticles[i].life -= dt;
        if (matterParticles[i].life <= 0) matterParticles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#020106'; ctx.fillRect(0, 0, W, H);

      const bhX = W * 0.5, bhY = H * 0.5;

      const grad = ctx.createRadialGradient(bhX, bhY, 40, bhX, bhY, 180);
      grad.addColorStop(0, '#000'); grad.addColorStop(0.3, '#ffaa00');
      grad.addColorStop(0.6, '#bd00ff'); grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(bhX, bhY, 180, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(bhX, bhY, 65, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffbb44'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bhX, bhY, 67, 0, Math.PI * 2); ctx.stroke();

      for (let p of platforms) {
        if (currentMode === p.requiredMode) {
          ctx.fillStyle = p.color; ctx.shadowBlur = 15; ctx.shadowColor = p.color;
          ctx.fillRect(p.x, p.y, p.w, p.h); ctx.shadowBlur = 0;
        } else {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.setLineDash([4, 4]);
          ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.setLineDash([]);
        }
      }

      for (let b of bullets) {
        ctx.fillStyle = b.isGrenade ? '#bd00ff' : '#00e5ff';
        ctx.shadowBlur = b.isGrenade ? 15 : 8; ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      for (let e of enemies) {
        ctx.fillStyle = e.isLeech ? '#39ff14' : '#ff2a00';
        ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.isLeech ? 8 : 12, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      for (let p of matterParticles) {
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3);
      }

      ctx.save();
      ctx.translate(stickman.x, stickman.y);
      ctx.rotate(stickman.angle);

      ctx.strokeStyle = activeMods.neonSkin ? '#39ff14' : '#35cdd7';
      ctx.shadowBlur = activeMods.neonSkin ? 12 : 0; ctx.shadowColor = '#39ff14';
      ctx.lineWidth = 3; ctx.lineCap = 'round';

      ctx.beginPath(); ctx.arc(0, -12, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = activeMods.neonSkin ? '#00e5ff' : '#ff0055';
      ctx.fillRect(2, -14, 4, 4);

      ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(12, 2); ctx.stroke();
      const legKick = Math.sin(performance.now() * 0.01) * 5;
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(-8 + legKick, 22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(8 - legKick, 22); ctx.stroke();

      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt); render();
      requestAnimationFrame(loop);
    }

    // Initial fetch so the store is ready when opened
    fetchStoreRegistry();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
