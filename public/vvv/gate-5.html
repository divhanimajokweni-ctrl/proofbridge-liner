<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gate E | FROST Signer</title>
  <link rel="stylesheet" href="/vvv/pools.css">
</head>
<body>
  <header class="vvu-header">
    <div class="logo">GATE E: FROST SIGNER</div>
    <div class="status-pill" id="gate-status">LOADING</div>
    <nav><a href="/proofbridge">← Gateway</a></nav>
  </header>

  <main style="padding:24px">
    <div class="card">
      <h3>FROST Threshold Signatures — 3-of-5</h3>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0">
        <div class="signer" data-id="1">Signer 1<span id="s1">--</span></div>
        <div class="signer" data-id="2">Signer 2<span id="s2">--</span></div>
        <div class="signer" data-id="3">Signer 3<span id="s3">--</span></div>
        <div class="signer" data-id="4">Signer 4<span id="s4">--</span></div>
        <div class="signer" data-id="5">Signer 5<span id="s5">--</span></div>
      </div>

      <div style="margin:12px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
        <div class="metric-row">Group Key: <span id="group-key" style="font-size:10px">--</span></div>
        <div class="metric-row">Last Sig: <span id="last-sig" style="font-size:10px">--</span></div>
        <div class="metric-row">Self-verify rate: <span id="verify-rate">--</span></div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px">
        <div class="metric-row">Signatures 1h: <span id="sigs-1h">--</span></div>
        <div class="metric-row">Threshold met: <span id="threshold-met">--</span></div>
        <div class="metric-row">Avg signing ms: <span id="avg-sign-ms">--</span></div>
      </div>
    </div>

    <div class="card terminal">
      <div class="terminal-header">FROST::SIGN-LOG</div>
      <div class="terminal-body" id="sign-log"></div>
    </div>
  </main>

  <script>
    function ts() {
      const n = new Date();
      return [n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
    }
    function randHex(len) { return Array.from({length:len}, ()=>Math.floor(Math.random()*16).toString(16)).join(''); }

    function renderFallback() {
      const onlineCount = Math.random() > 0.05 ? 5 : 4;
      const offlineIdx  = onlineCount === 4 ? Math.floor(Math.random()*5)+1 : -1;

      for (let i = 1; i <= 5; i++) {
        const online = i !== offlineIdx;
        const el = document.getElementById(`s${i}`);
        el.textContent = online ? 'ONLINE' : 'OFFLINE';
        el.style.color = online ? 'var(--green)' : 'var(--red)';
      }

      const groupKey = randHex(64);
      const lastSig  = randHex(64);
      document.getElementById('gate-status').textContent = onlineCount >= 3 ? 'THRESHOLD MET' : 'BELOW THRESHOLD';
      document.getElementById('gate-status').className   = `status-pill ${onlineCount >= 3 ? 'ok' : 'error'}`;
      document.getElementById('group-key').textContent   = groupKey.slice(0,20)+'...';
      document.getElementById('last-sig').textContent    = lastSig.slice(0,20)+'...';
      document.getElementById('verify-rate').textContent = (Math.random()*2+98).toFixed(1)+'%';
      document.getElementById('sigs-1h').textContent     = Math.floor(Math.random()*40+60);
      document.getElementById('threshold-met').textContent = onlineCount >= 3 ? 'YES' : 'NO';
      document.getElementById('threshold-met').style.color = onlineCount >= 3 ? 'var(--green)' : 'var(--red)';
      document.getElementById('avg-sign-ms').textContent = Math.floor(Math.random()*30+80)+'ms';

      const signerSets = ['1,2,3','1,2,4','1,3,5','2,3,4','1,2,5'];
      document.getElementById('sign-log').innerHTML = Array.from({length:6}, () => {
        const signers = signerSets[Math.floor(Math.random()*signerSets.length)];
        const propId  = `prop_${randHex(6)}`;
        const ok      = Math.random() > 0.02;
        return `[${ts()}] ${propId} signers:[${signers}] ${ok?'<span style="color:#00FF88">✓ verified</span>':'<span style="color:#FF4444">✗ failed</span>'}`;
      }).join('<br>');
    }

    async function loadGateE() {
      try {
        const res = await fetch('/api/metrics/gate-e');
        if (!res.ok) throw new Error();
        const d = await res.json();
        document.getElementById('gate-status').textContent = d.statusLabel;
        document.getElementById('gate-status').className = `status-pill ${d.status === 'complete' ? 'ok' : 'error'}`;
        document.getElementById('group-key').textContent = d.groupKey?.slice(0,20)+'...';
        document.getElementById('last-sig').textContent  = d.lastSig?.slice(0,20)+'...';
        document.getElementById('verify-rate').textContent = (d.verifyRate*100).toFixed(1)+'%';
        (d.signers||[]).forEach(s => {
          const el = document.getElementById(`s${s.id}`);
          if (!el) return;
          el.textContent = s.online ? 'ONLINE' : 'OFFLINE';
          el.style.color = s.online ? 'var(--green)' : 'var(--red)';
        });
        document.getElementById('sign-log').innerHTML = (d.logs||[]).map(l =>
          `[${l.ts}] ${l.proposal_id} signers:[${l.signer_ids?.join(',')}] ${l.verified?'<span style="color:#00FF88">✓</span>':'<span style="color:#FF4444">✗</span>'}`
        ).join('<br>');
      } catch { renderFallback(); }
    }

    loadGateE();
    setInterval(loadGateE, 10000);
  </script>
</body>
</html>
