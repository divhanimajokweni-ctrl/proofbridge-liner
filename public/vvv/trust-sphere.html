<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trust Sphere — VVU Trust Runtime</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap');
  :root{
    --void:#09090f;
    --void-2:#0f0f18;
    --crimson:#C41E3A;
    --gold:#C9A84C;
    --unknown:#2a2d3a;
    --identity:#3d6bff;
    --contribution:#3dd6ff;
    --receipt:#3dffb0;
    --hash:#c9a84c;
    --zk:#b23dff;
    --trust:#ff2e5f;
    --text:#e8e6e0;
    --dim:#7b7d8c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:radial-gradient(ellipse at 50% 30%, var(--void-2), var(--void) 70%);
    color:var(--text);
    font-family:'DM Sans',sans-serif;
    height:100%;
    overflow:hidden;
  }
  #wrap{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;}
  header{
    padding:22px 28px 8px;
    display:flex;justify-content:space-between;align-items:flex-start;
    z-index:5;
  }
  h1{
    font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:0.02em;
    color:var(--text);
  }
  h1 span{color:var(--gold);}
  .subtitle{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:0.02em;}
  #stage{position:relative;flex:1;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;}
  #legend{
    position:absolute;top:22px;right:28px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);
    background:rgba(9,9,15,0.55);border:1px solid rgba(255,255,255,0.06);
    border-radius:10px;padding:14px 16px;backdrop-filter:blur(6px);
    min-width:200px;z-index:5;
  }
  #legend .title{color:var(--text);font-family:'Syne',sans-serif;font-weight:700;font-size:11px;margin-bottom:10px;letter-spacing:0.04em;text-transform:uppercase;}
  .lg-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .lg-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  #footer{
    padding:14px 28px 20px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);
    z-index:5;
  }
  #footer .metric{color:var(--gold);}
  #tooltip{
    position:absolute;pointer-events:none;
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    background:rgba(9,9,15,0.9);border:1px solid rgba(255,255,255,0.1);
    border-radius:6px;padding:8px 10px;color:var(--text);
    opacity:0;transition:opacity 0.15s;z-index:10;line-height:1.5;
    max-width:220px;
  }
  #controls{
    position:absolute;bottom:20px;left:28px;z-index:5;
    display:flex;gap:8px;
  }
  button{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
    color:var(--dim);padding:7px 12px;border-radius:6px;cursor:pointer;
    transition:all 0.15s;
  }
  button:hover{color:var(--text);border-color:var(--gold);}
  button.active{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,0.08);}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div>
      <h1>Trust <span>Sphere</span></h1>
      <div class="subtitle">VVU TRUST RUNTIME · LIVE VERIFICATION STATE SPACE</div>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="legend">
      <div class="title">Node State</div>
      <div class="lg-row"><span class="lg-dot" style="background:var(--unknown)"></span>Unknown</div>
      <div class="lg-row"><span class="lg-dot" style="background:var(--identity)"></span>Identity Verified</div>
      <div class="lg-row"><span class="lg-dot" style="background:var(--contribution)"></span>Contribution Verified</div>
      <div class="lg-row"><span class="lg-dot" style="background:var(--receipt)"></span>Receipt Generated</div>
      <div class="lg-row"><span class="lg-dot" style="background:var(--hash)"></span>Hash Linked</div>
      <div class="lg-row"><span class="lg-dot" style="background:var(--zk)"></span>ZK Proof Generated</div>
      <div class="lg-row"><span class="lg-dot" style="background:var(--trust)"></span>Trust Increased</div>
    </div>
    <div id="tooltip"></div>
    <div id="controls">
      <button id="btnGlobal" class="active">Global View</button>
      <button id="btnPersonal">Personal View</button>
    </div>
  </div>
  <div id="footer">
    <div>Verified identities: <span class="metric" id="mCount">—</span></div>
    <div>Trust density: <span class="metric" id="mDensity">—</span></div>
    <div id="mQuestion">"How healthy is the trust network right now?"</div>
  </div>
</div>

<script>
/*
  TRUST SPHERE — implementation notes
  ------------------------------------
  This is NOT a rotating Earth. It is a Fibonacci-distributed point sphere
  (a mathematical network boundary), rotating on two independent axes
  simultaneously so the motion reads as a tumbling constellation, not a
  planet. Each point is a verified entity progressing through a fixed
  state machine that mirrors a ZK-proof pipeline's *observable* stages —
  the sphere reveals verification state, never underlying private data.
*/

const STATES = ['unknown','identity','contribution','receipt','hash','zk','trust'];
const STATE_COLORS = {
  unknown:'#2a2d3a', identity:'#3d6bff', contribution:'#3dd6ff',
  receipt:'#3dffb0', hash:'#c9a84c', zk:'#b23dff', trust:'#ff2e5f'
};
const STATE_LABELS = {
  unknown:'Unverified', identity:'Identity Verified', contribution:'Contribution Verified',
  receipt:'Receipt Generated', hash:'Hash Linked', zk:'ZK Proof Generated', trust:'Trust Increased'
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const stage = document.getElementById('stage');

let W, H, DPR;
function resize(){
  DPR = window.devicePixelRatio || 1;
  W = stage.clientWidth; H = stage.clientHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

// ---- Fibonacci sphere point distribution (irreducible geometry, not a map) ----
const N = 420;
const RADIUS = 1;
function fibonacciSphere(n){
  const pts = [];
  const golden = Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = 1-(i/(n-1))*2;
    const r = Math.sqrt(1-y*y);
    const theta = golden*i;
    pts.push({
      x:Math.cos(theta)*r, y:y, z:Math.sin(theta)*r,
      state: 'unknown',
      stateT: Math.random()*8000, // stagger progression
      isSelf: false,
      ripple: 0
    });
  }
  return pts;
}
const points = fibonacciSphere(N);
// designate a "self" node for personal view
const selfIdx = 7;
points[selfIdx].isSelf = true;
points[selfIdx].state = 'trust';

// Each node cycles through the state machine at its own pace, staggered,
// so the sphere is never "finished" — a living system, always verifying.
const STATE_DURATION = 3200; // ms per state advance (per-node jitter applied)

let rotY = 0, rotX = 0;
let angVelY = 0.00028, angVelX = 0.00011; // dual-axis, non-Earth tumble
let hoverPoint = null;
let mode = 'global';

document.getElementById('btnGlobal').onclick = ()=>{
  mode='global';
  document.getElementById('btnGlobal').classList.add('active');
  document.getElementById('btnPersonal').classList.remove('active');
  document.getElementById('mQuestion').textContent = '"How healthy is the trust network right now?"';
};
document.getElementById('btnPersonal').onclick = ()=>{
  mode='personal';
  document.getElementById('btnPersonal').classList.add('active');
  document.getElementById('btnGlobal').classList.remove('active');
  document.getElementById('mQuestion').textContent = '"Where do I fit in the network?"';
};

function project(p){
  // rotate Y
  let x = p.x*Math.cos(rotY) - p.z*Math.sin(rotY);
  let z = p.x*Math.sin(rotY) + p.z*Math.cos(rotY);
  let y = p.y;
  // rotate X
  let y2 = y*Math.cos(rotX) - z*Math.sin(rotX);
  let z2 = y*Math.sin(rotX) + z*Math.cos(rotX);
  const scale = Math.min(W,H)*0.34;
  const persp = 2.6/(2.6+z2); // simple perspective depth
  return {
    sx: W/2 + x*scale*persp,
    sy: H/2 + y2*scale*persp,
    depth: z2,
    persp
  };
}

let lastTime = performance.now();
function tick(now){
  const dt = now-lastTime; lastTime = now;
  rotY += angVelY*dt;
  rotX += angVelX*dt;

  // advance node states (staggered emergent progression)
  for(const p of points){
    p.stateT += dt;
    if(p.stateT > STATE_DURATION + (p._jit||(p._jit=Math.random()*4000))){
      const idx = STATES.indexOf(p.state);
      if(idx < STATES.length-1){ p.state = STATES[idx+1]; p.ripple = 1; }
      p.stateT = 0;
    }
    if(p.ripple>0) p.ripple = Math.max(0, p.ripple - dt/900);
  }

  ctx.clearRect(0,0,W,H);

  // project + sort by depth (painter's algorithm)
  const proj = points.map(p=>({p, ...project(p)}));
  proj.sort((a,b)=>a.depth-b.depth);

  // draw sparse connective edges between near, verified-state neighbors
  ctx.lineWidth = 0.5;
  for(let i=0;i<proj.length;i++){
    const a = proj[i];
    if(STATES.indexOf(a.p.state) < 2) continue;
    for(let j=i+1;j<Math.min(i+6,proj.length);j++){
      const b = proj[j];
      if(STATES.indexOf(b.p.state) < 2) continue;
      const dx=a.sx-b.sx, dy=a.sy-b.sy;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d < 46){
        const alpha = (1-d/46)*0.12*Math.min(a.persp,b.persp);
        ctx.strokeStyle = `rgba(201,168,76,${alpha})`;
        ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
      }
    }
  }

  // draw nodes
  hoverPoint = null;
  for(const item of proj){
    const {p, sx, sy, persp} = item;
    let r = 2.0*persp + 0.6;
    let color = STATE_COLORS[p.state];
    let alpha = 0.55 + 0.45*persp;

    if(mode==='personal'){
      if(p.isSelf){ r*=2.4; alpha=1; }
      else if(!p.isSelf){ alpha *= 0.35; } // dim the network, foreground self
    }
    if(p.isSelf){ color = '#ff2e5f'; }

    if(p.ripple>0){
      ctx.beginPath();
      ctx.arc(sx,sy,r+p.ripple*10,0,Math.PI*2);
      ctx.strokeStyle = `rgba(201,168,76,${p.ripple*0.5})`;
      ctx.lineWidth=1;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = color;
    ctx.shadowBlur = p.isSelf ? 14 : 4*persp;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    item._sx=sx; item._sy=sy; item._r=Math.max(r,4);
  }

  document.getElementById('mCount').textContent = points.filter(p=>STATES.indexOf(p.state)>=1).length;
  document.getElementById('mDensity').textContent =
    (points.filter(p=>STATES.indexOf(p.state)>=4).length/points.length*100).toFixed(1)+'%';

  window._lastProj = proj;
  requestAnimationFrame(tick);
}

canvas.addEventListener('mousemove', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  let found = null, bestD = 12;
  for(const item of (window._lastProj||[])){
    const d = Math.hypot(item._sx-mx, item._sy-my);
    if(d<bestD){ bestD=d; found=item; }
  }
  if(found){
    tooltip.style.opacity=1;
    tooltip.style.left = (mx+16)+'px';
    tooltip.style.top = (my+16)+'px';
    tooltip.innerHTML = `<b>${found.p.isSelf?'Your Identity':'Node'}</b><br>State: ${STATE_LABELS[found.p.state]}`;
  } else {
    tooltip.style.opacity=0;
  }
});
canvas.addEventListener('mouseleave', ()=>{ tooltip.style.opacity=0; });

resize();
requestAnimationFrame(tick);
</script>
</body>
</html>
