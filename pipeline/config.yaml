      value: 25.0
      status: unverified_placeholder
      source: "engineering estimate — not signed off, see HYDRO_GATEWAY_VALIDATION.md Section 1"
    mop_bar:
      value: 37.5
      status: unverified_placeholder
      source: "engineering estimate — not signed off"
