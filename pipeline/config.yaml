# PROVENANCE RULE: every engineering value below carries a `status` field.
#   status: signed              → came from a signed engineering input (see source)
#   status: unverified_placeholder → NOT signed off; safe for synthetic-data
#                                     generation and AI demo purposes only.
#                                     MUST NOT be reported as "verified" anywhere
#                                     downstream (report template enforces this).
#
# Cross-reference: HYDRO_GATEWAY_VALIDATION.md flagged design_pressure_bar,
# mop_bar, and all material specs as NOT SUPPLIED as of the last engineering
# review. Update `status: signed` + `source:` only after real sign-off lands.

