    value: 85.0
    status: unverified_placeholder
    source: "not confirmed by Controls & Safety — see action item 7 in validation report"
  inference_latency_target_ms:
    value: 2.1
    status: unverified_placeholder

output:
  output_dir: "outputs"
  model_file: "anomaly_model.pt"
  ledger_file: "ledger.json"
