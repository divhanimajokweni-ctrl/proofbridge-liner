<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VVU AIR KERNEL — TILT COMMAND CENTER</title>
    <style>
        :root {
            --bg: #04080d;
            --panel: #0a1016;
            --line: #1a2732;
            --cyan: #00d4ff;
            --green: #00ff88;
            --red: #ff4d4d;
            --amber: #ffb800;
            --dim: #4a6270;
            --fg: #c9d4dc;
            --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--fg);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* ── Mobile-Landscape Grid ── */
        .mobile-grid {
            display: grid;
            grid-template-columns: 160px 1fr 170px;
            height: 100dvh;
            width: 100vw;
            gap: 1px;
            background: var(--line);
        }

        /* ── Panel Base ── */
        .panel {
            background: var(--panel);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            background: rgba(0, 212, 255, 0.03);
            border-bottom: 1px solid var(--line);
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 32px;
        }

        .panel-header h1 {
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--cyan);
            text-transform: uppercase;
            margin: 0;
        }

        .panel-header .status-chip {
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        /* ── Control Buttons ── */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
        }

        .command-btn {
            background: var(--cyan);
            color: var(--bg);
            border: none;
            padding: 10px;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            border-radius: 2px;
            width: 100%;
            margin-bottom: 4px;
        }

        .command-btn:hover {
            background: var(--green);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .command-btn.danger {
            background: var(--red);
            color: white;
        }

        .command-btn.deploy {
            background: var(--green);
            color: var(--bg);
        }

        .command-btn.tilt-btn {
            background: var(--amber);
            color: var(--bg);
        }

        .command-btn.tilt-btn.active {
            background: var(--green);
            color: var(--bg);
        }

        .command-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Toggle ── */
        .tilt-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 8px;
            margin: 8px;
            font-size: 10px;
        }

        .tilt-toggle .toggle-label {
            color: var(--dim);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--line);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch.active {
            background: var(--green);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        /* ── 3D Viewport ── */
        .viewport-3d {
            position: relative;
            background: #020508;
        }

        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── HUD ── */
        .hud-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(4, 8, 13, 0.85);
            border: 1px solid var(--cyan);
            border-left: 2px solid var(--cyan);
            padding: 8px 10px;
            backdrop-filter: blur(4px);
            z-index: 10;
            min-width: 150px;
            pointer-events: none;
        }

        .hud-title {
            color: var(--cyan);
            font-size: 8px;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .hud-stat {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 11px;
            margin: 4px 0;
        }

        .hud-stat .label { color: var(--dim); }
        .hud-stat .value { font-weight: bold; font-size: 12px; }
        .hud-stat .value.normal { color: var(--green); }
        .hud-stat .value.alert { color: var(--amber); }
        .hud-stat .value.critical { color: var(--red); }

        /* ── Tilt Indicator ── */
        .tilt-indicator {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 184, 0, 0.9);
            color: var(--bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 20;
            display: none;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(255, 184, 0, 0.3);
        }

        .tilt-indicator.show {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ── EIS Trust Gauge ── */
        .trust-gauge-container {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 10px;
            margin: 8px;
        }

        .gauge-title {
            font-size: 9px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .trust-bar {
            height: 20px;
            background: #080c10;
            border: 1px solid var(--line);
            position: relative;
            display: flex;
            margin-bottom: 6px;
            border-radius: 2px;
            overflow: hidden;
        }

        .trust-segment {
            height: 100%;
            border-right: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--dim);
            transition: all 0.3s ease;
        }

        .trust-segment.earned {
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.4), rgba(0, 255, 136, 0.1));
            color: var(--green);
            font-weight: bold;
        }

        .trust-threshold {
            position: absolute;
            top: -3px;
            bottom: -3px;
            width: 2px;
            background: var(--amber);
            box-shadow: 0 0 8px var(--amber);
            z-index: 2;
        }

        .trust-value {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .trust-value.verified { color: var(--green); }
        .trust-value.unverified { color: var(--amber); }

        /* ── Verdict ── */
        .verdict-badge {
            text-align: center;
            padding: 10px;
            border: 2px solid;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 8px;
            animation: pulse 2s infinite;
            border-radius: 2px;
        }

        .verdict-badge.verified {
            border-color: var(--green);
            color: var(--green);
            background: rgba(0, 255, 136, 0.08);
        }

        .verdict-badge.unconfirmed {
            border-color: var(--amber);
            color: var(--amber);
            background: rgba(255, 184, 0, 0.08);
        }

        .verdict-badge.awaiting {
            border-color: var(--dim);
            color: var(--dim);
            background: rgba(74, 98, 112, 0.08);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        /* ── Evidence List ── */
        .evidence-list-container {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 4px;
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            margin: 8px;
            min-height: 120px;
            max-height: 180px;
        }

        .evidence-item {
            background: rgba(0, 255, 136, 0.04);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 4px;
            padding: 6px;
            margin-bottom: 6px;
        }

        .evidence-type {
            font-size: 9px;
            font-weight: bold;
            color: var(--cyan);
            margin-bottom: 2px;
        }

        .evidence-value {
            font-size: 9px;
            color: var(--fg);
            margin-bottom: 4px;
        }

        .evidence-attestation {
            font-size: 7px;
            color: var(--dim);
            word-break: break-all;
            border-top: 1px dashed var(--line);
            padding-top: 4px;
        }

        /* ── Event Log ── */
        .log-container {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 4px;
            height: 120px;
            overflow-y: auto;
            padding: 6px;
            font-size: 8px;
            line-height: 1.6;
            margin: 8px;
        }

        .log-entry {
            border-bottom: 1px solid rgba(26, 39, 50, 0.4);
            padding: 1px 0;
            display: flex;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-entry .time { color: var(--dim); flex-shrink: 0; }
        .log-entry .level { font-weight: bold; flex-shrink: 0; width: 36px; }
        .log-entry .msg { overflow: hidden; text-overflow: ellipsis; }

        .level.INFO { color: var(--cyan); }
        .level.ALERT { color: var(--amber); }
        .level.CRITICAL { color: var(--red); }
        .level.SUCCESS { color: var(--green); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            top: 12px;
            right: 12px;
            background: var(--panel);
            border: 1px solid var(--cyan);
            border-left: 3px solid var(--cyan);
            padding: 10px 14px;
            font-size: 10px;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            max-width: 280px;
            pointer-events: none;
        }

        .toast.show { transform: translateX(0); }
        .toast.success { border-color: var(--green); border-left-color: var(--green); }
        .toast.error { border-color: var(--red); border-left-color: var(--red); }
        .toast.warning { border-color: var(--amber); border-left-color: var(--amber); }

        /* ── Orientation Lock Banner ── */
        .rotate-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--amber);
            color: var(--bg);
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            z-index: 9999;
            display: none;
        }

        .rotate-banner.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="rotate-banner" id="rotate-banner">🔄 Rotate your phone to landscape for the best experience</div>

    <div class="mobile-grid" id="mobile-grid">
        <!-- LEFT: Controls -->
        <div class="panel">
            <div class="panel-header">
                <h1>CONTROL</h1>
                <span class="status-chip">ACTIVE</span>
            </div>
            
            <div class="panel-body">
                <div class="btn-group">
                    <button class="command-btn" id="simulate-leak-btn">⚡ LEAK</button>
                    <button class="command-btn danger" id="reset-btn">🔄 RESET</button>
                    <button class="command-btn deploy" id="deploy-btn">📡 DEPLOY</button>
                </div>

                <!-- Tilt Mode Toggle -->
                <div class="tilt-toggle">
                    <span class="toggle-label">TILT MODE</span>
                    <div class="toggle-switch" id="tilt-toggle" onclick="toggleTiltMode()">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
            </div>

            <div class="panel-header" style="border-top:1px solid var(--line);">
                <h1 style="color:var(--green);">LOG</h1>
                <span class="status-chip" style="border-color:var(--green);color:var(--green);">LIVE</span>
            </div>
            <div class="log-container" id="event-log">
                <div class="log-entry">
                    <span class="time">[00:00]</span>
                    <span class="level INFO">INFO</span>
                    <span class="msg">AIR KERNEL booted</span>
                </div>
            </div>
        </div>

        <!-- CENTER: 3D Viewport -->
        <div class="panel viewport-3d">
            <canvas id="three-canvas"></canvas>
            
            <div class="hud-overlay">
                <div class="hud-title">LIVE TELEMETRY</div>
                <div class="hud-stat">
                    <span class="label">Flow:</span>
                    <span class="value normal" id="hud-flow">97.0 L/s</span>
                </div>
                <div class="hud-stat">
                    <span class="label">Press:</span>
                    <span class="value normal" id="hud-pressure">48.4 m</span>
                </div>
                <div class="hud-stat">
                    <span class="label">Status:</span>
                    <span class="value normal" id="hud-status">NOMINAL</span>
                </div>
            </div>

            <div class="tilt-indicator" id="tilt-indicator">📱 TILT MODE ACTIVE</div>
        </div>

        <!-- RIGHT: EIS + Evidence -->
        <div class="panel">
            <div class="panel-header">
                <h1>EIS v1.0</h1>
                <span class="status-chip">ENGINE</span>
            </div>
            
            <div class="panel-body" style="display:flex;flex-direction:column;gap:8px;">
                <div class="trust-gauge-container">
                    <div class="gauge-title">TRUST SCORE</div>
                    <div class="trust-bar" id="trust-bar">
                        <div class="trust-segment" style="width:30%;" id="seg-flow">
                            <span>FLOW</span>
                        </div>
                        <div class="trust-segment" style="width:20%;" id="seg-pressure">
                            <span>PRESS</span>
                        </div>
                        <div class="trust-segment" style="width:50%;" id="seg-field">
                            <span>FIELD</span>
                        </div>
                        <div class="trust-threshold" style="left:70%;"></div>
                    </div>
                    <div class="trust-value" id="trust-value">0.00</div>
                </div>

                <div class="verdict-badge awaiting" id="verdict-badge">AWAITING</div>

                <div class="gauge-title" style="margin-top:8px;">EVIDENCE</div>
                <div class="evidence-list-container" id="evidence-list">
                    <div style="color:var(--dim);font-size:9px;text-align:center;padding:10px;">
                        No evidence yet
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // ===========================================================================
        //  VVU AIR KERNEL — MOBILE TILT COMMAND CENTER
        //  Uses DeviceOrientation API to control the 3D camera
        //  Requires HTTPS or localhost for iOS permission
        // ===========================================================================

        // ---------- System State ----------
        const state = {
            baselineFlow: 97.0,
            baselinePressure: 48.4,
            currentFlow: 97.0,
            currentPressure: 48.4,
            leakActive: false,
            evidence: [],
            trustScore: 0.0,
            verdict: 'AWAITING_EVIDENCE',
            tiltEnabled: false,
            lastPermissionRequest: 0,
        };

        // ---------- Three.js Setup ----------
        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020508);
        
        // Stars
        const starsGeo = new THREE.BufferGeometry();
        const starsVertices = [];
        for (let i = 0; i < 1000; i++) {
            starsVertices.push(
                (Math.random() - 0.5) * 60,
                (Math.random() - 0.5) * 60,
                (Math.random() - 0.5) * 60
            );
        }
        starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0x1a2732, size: 0.03 }));
        scene.add(stars);

        const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 100);
        camera.position.set(12, 10, 16);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        const controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.enablePan = false; // Disable on mobile for simplicity

        // Lighting
        scene.add(new THREE.AmbientLight(0x334455, 0.8));
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(8, 12, 6);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const cyanLight = new THREE.PointLight(0x00d4ff, 1.2, 20);
        cyanLight.position.set(-5, 2, 4);
        scene.add(cyanLight);

        const greenLight = new THREE.PointLight(0x00ff88, 0.8, 15);
        greenLight.position.set(5, 2, -4);
        scene.add(greenLight);

        // Ground grid
        const grid = new THREE.GridHelper(20, 20, 0x1a2732, 0x111a22);
        scene.add(grid);

        // Pipe Network
        const pipeMat = new THREE.MeshPhongMaterial({
            color: 0x2a3d5c,
            specular: 0x00d4ff,
            shininess: 30,
            transparent: true,
            opacity: 0.85
        });

        const pipeGroup = new THREE.Group();
        scene.add(pipeGroup);

        function createPipe(points, radius = 0.15) {
            const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
            const geo = new THREE.TubeGeometry(curve, 48, radius, 8, false);
            const mesh = new THREE.Mesh(geo, pipeMat);
            mesh.castShadow = true;
            pipeGroup.add(mesh);
            return mesh;
        }

        // Main trunk
        createPipe([[-5, 0, 0], [-2, 0, 0], [0, 0, 0], [2, 0, 0], [5, 0, 0]], 0.2);
        
        // DMA branches
        createPipe([[0, 0, 0], [0, 0, 2], [0, 0, 4]], 0.15);
        createPipe([[0, 0, 0], [0, 0, -2], [0, 0, -4]], 0.15);
        createPipe([[-2, 0, 0], [-2, 0, 1.5], [-2, 0, 3]], 0.12);
        createPipe([[2, 0, 0], [2, 0, -1.5], [2, 0, -3]], 0.12);

        // Valve
        const valveBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12),
            new THREE.MeshPhongMaterial({ color: 0xffb800, metalness: 0.7, roughness: 0.3 })
        );
        valveBody.position.set(0, 0, 0);
        scene.add(valveBody);

        const valveWheel = new THREE.Mesh(
            new THREE.TorusGeometry(0.3, 0.04, 8, 12),
            new THREE.MeshPhongMaterial({ color: 0x444444, metalness: 0.8 })
        );
        valveWheel.rotation.x = Math.PI / 2;
        valveWheel.position.y = 0.4;
        scene.add(valveWheel);

        // Sensors
        const sensorGeo = new THREE.OctahedronGeometry(0.25);
        const flowSensor = new THREE.Mesh(sensorGeo, new THREE.MeshPhongMaterial({ 
            color: 0x00d4ff, emissive: 0x004d66, metalness: 0.5 
        }));
        flowSensor.position.set(-2, 0.6, 0);
        scene.add(flowSensor);

        const pressureSensor = new THREE.Mesh(sensorGeo, new THREE.MeshPhongMaterial({ 
            color: 0xff4d4d, emissive: 0x4d0000, metalness: 0.5 
        }));
        pressureSensor.position.set(2, 0.6, 0);
        scene.add(pressureSensor);

        // Leak particles
        const leakGroup = new THREE.Group();
        leakGroup.visible = false;

        for (let i = 0; i < 30; i++) {
            const particle = new THREE.Mesh(
                new THREE.SphereGeometry(0.05, 4, 4),
                new THREE.MeshPhongMaterial({ 
                    color: 0x00ff88, 
                    emissive: 0x004d33,
                    transparent: true,
                    opacity: 0.8
                })
            );
            leakGroup.add(particle);
        }
        leakGroup.position.set(1, 0.2, 0);
        scene.add(leakGroup);

        // Flow particles
        const flowParticles = [];
        const flowParticleGeo = new THREE.SphereGeometry(0.04, 4, 4);
        const flowParticleMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.6 });

        for (let i = 0; i < 20; i++) {
            const particle = new THREE.Mesh(flowParticleGeo, flowParticleMat);
            particle.position.set(-5 + (i * 0.5), 0, 0);
            flowParticles.push(particle);
            scene.add(particle);
        }

        // DMA Boundary
        const dmaBoundary = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-4, 0, -4),
                new THREE.Vector3(-4, 0, 4),
                new THREE.Vector3(4, 0, 4),
                new THREE.Vector3(4, 0, -4)
            ]),
            new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.3 })
        );
        scene.add(dmaBoundary);

        // ---------- Device Orientation (Tilt Mode) ----------
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };

        function toggleTiltMode() {
            state.tiltEnabled = !state.tiltEnabled;
            
            const toggle = document.getElementById('tilt-toggle');
            const tiltIndicator = document.getElementById('tilt-indicator');
            
            toggle.classList.toggle('active');
            
            if (state.tiltEnabled) {
                // Request permission for iOS
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permission => {
                            if (permission === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                tiltIndicator.classList.add('show');
                                logEvent('SUCCESS', 'Tilt mode activated - gyroscope access granted');
                                showToast('📱 Tilt your phone to explore the 3D scene', 'success');
                            } else {
                                state.tiltEnabled = false;
                                toggle.classList.remove('active');
                                logEvent('ALERT', 'Motion permission denied by user');
                                showToast('Motion access denied - tilt mode disabled', 'error');
                            }
                        })
                        .catch(err => {
                            logEvent('ERROR', 'Permission request failed: ' + err.message);
                        });
                } else {
                    // Android or older iOS
                    window.addEventListener('deviceorientation', handleOrientation);
                    tiltIndicator.classList.add('show');
                    logEvent('SUCCESS', 'Tilt mode activated');
                    showToast('📱 Tilt your phone to explore the 3D scene', 'success');
                }
            } else {
                // Disable tilt
                window.removeEventListener('deviceorientation', handleOrientation);
                tiltIndicator.classList.remove('show');
                logEvent('INFO', 'Tilt mode deactivated - mouse controls enabled');
            }
        }

        function handleOrientation(event) {
            if (!state.tiltEnabled) return;
            
            // Normalize values (convert to radians for camera)
            const beta = event.beta;  // Front-to-back tilt (0 to 180, 90 = flat)
            const gamma = event.gamma; // Left-to-right tilt (-90 to 90, 0 = flat)
            
            // Convert to camera rotations
            // Pitch: beta - 90 (so flat = 0)
            // Roll: gamma
            targetRotation.x = THREE.MathUtils.degToRad(beta - 90);
            targetRotation.y = THREE.MathUtils.degToRad(gamma);
        }

        // ---------- Animation Loop ----------
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Flow particles
            flowParticles.forEach((particle, i) => {
                particle.position.x = -5 + ((i * 0.5 + time * 2.5) % 10);
                particle.position.z = Math.sin(time * 1.5 + i) * 0.08;
            });

            // Leak particles
            if (state.leakActive) {
                leakGroup.children.forEach((particle, i) => {
                    const y = (i * 0.12 + time * 1.8) % 1.5;
                    particle.position.y = y;
                    particle.position.x = Math.sin(time * 2.5 + i) * 0.2 * (1 - y / 1.5);
                    particle.position.z = Math.cos(time * 2.5 + i) * 0.2 * (1 - y / 1.5);
                    particle.material.opacity = 0.8 * (1 - y / 1.5);
                });
                leakGroup.visible = true;
            } else {
                leakGroup.visible = false;
            }

            // Rotating sensors
            flowSensor.rotation.y += 0.02;
            pressureSensor.rotation.y += 0.02;
            valveWheel.rotation.z += 0.01;

            // Sensor color states
            if (state.currentFlow > state.baselineFlow * 1.10) {
                flowSensor.material.color.set(0xffb800);
                flowSensor.material.emissive.set(0x4d3300);
            } else if (state.currentFlow < 0) {
                flowSensor.material.color.set(0xff4d4d);
                flowSensor.material.emissive.set(0x4d0000);
            } else {
                flowSensor.material.color.set(0x00d4ff);
                flowSensor.material.emissive.set(0x004d66);
            }

            // Apply tilt mode
            if (state.tiltEnabled) {
                // Smooth interpolation
                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
                currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;
                
                // Apply to camera (limited range)
                camera.position.x = 12 * Math.sin(currentRotation.y) * Math.cos(currentRotation.x);
                camera.position.y = 12 * Math.sin(currentRotation.x) * 0.5;
                camera.position.z = 12 * Math.cos(currentRotation.y) * Math.cos(currentRotation.x);
                camera.lookAt(0, 0, 0);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }

        // ---------- Utility Functions ----------
        function logEvent(level, message) {
            const log = document.getElementById('event-log');
            const now = new Date();
            const timeStr = `[${now.toISOString().substr(11, 8)}]`;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="time">${timeStr}</span><span class="level ${level}">${level}</span><span class="msg">${message}</span>`;
            log.insertBefore(entry, log.firstChild);
            while (log.children.length > 30) log.removeChild(log.lastChild);
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function updateHUD() {
            document.getElementById('hud-flow').textContent = state.currentFlow.toFixed(1) + ' L/s';
            document.getElementById('hud-pressure').textContent = state.currentPressure.toFixed(1) + ' m';
            
            const status = document.getElementById('hud-status');
            if (state.currentFlow < 0) {
                status.textContent = 'IMPOSSIBLE';
                status.className = 'value critical';
            } else if (state.currentFlow > state.baselineFlow * 1.10) {
                status.textContent = 'ANOMALY';
                status.className = 'value alert';
            } else {
                status.textContent = 'NOMINAL';
                status.className = 'value normal';
            }
        }

        // ---------- EIS v1.0 Engine ----------
        function updateEIS() {
            const flowDev = (state.currentFlow - state.baselineFlow) / state.baselineFlow * 100;
            const pressureDrop = state.baselinePressure - state.currentPressure;

            // Reset segments
            document.getElementById('seg-flow').classList.remove('earned');
            document.getElementById('seg-pressure').classList.remove('earned');
            document.getElementById('seg-field').classList.remove('earned');

            let trust = 0;

            if (flowDev > 10) {
                trust += 0.30;
                document.getElementById('seg-flow').classList.add('earned');
            }

            if (pressureDrop > 0.5 && state.currentPressure < 47.0) {
                trust += 0.20;
                document.getElementById('seg-pressure').classList.add('earned');
            }

            if (state.evidence.length > 0) {
                trust += Math.min(state.evidence.length * 0.25, 0.50);
                document.getElementById('seg-field').classList.add('earned');
            }

            state.trustScore = Math.round(trust * 100) / 100;

            const trustValue = document.getElementById('trust-value');
            trustValue.textContent = state.trustScore.toFixed(2);
            
            const verdictBadge = document.getElementById('verdict-badge');
            if (state.trustScore >= 0.7) {
                verdictBadge.textContent = 'VERIFIED';
                verdictBadge.className = 'verdict-badge verified';
                trustValue.className = 'trust-value verified';
                showToast('✔ VERIFIED CANDIDATE DETECTED', 'success');
            } else if (state.trustScore > 0.0) {
                verdictBadge.textContent = 'INSUFFICIENT';
                verdictBadge.className = 'verdict-badge unconfirmed';
                trustValue.className = 'trust-value unverified';
            } else {
                verdictBadge.textContent = 'AWAITING';
                verdictBadge.className = 'verdict-badge awaiting';
                trustValue.className = 'trust-value';
            }
        }

        // ---------- Evidence ----------
        function addFieldEvidence(type, id, value) {
            const evidence = {
                type,
                id,
                value,
                attestation: '0x' + Array.from(crypto.getRandomValues(new Uint8Array(5)))
                    .map(b => b.toString(16).padStart(2, '0')).join('') + '...'
            };
            
            state.evidence.push(evidence);
            
            const list = document.getElementById('evidence-list');
            if (list.querySelector('div[style*="No evidence"]')) {
                list.innerHTML = '';
            }
            
            const item = document.createElement('div');
            item.className = 'evidence-item';
            item.innerHTML = `
                <div class="evidence-type">[${type}] ${id}</div>
                <div class="evidence-value">${value}</div>
                <div class="evidence-attestation">${evidence.attestation}</div>
            `;
            list.appendChild(item);
            
            updateEIS();
            logEvent('INFO', `${type} evidence linked: ${id}`);
        }

        // ---------- Simulate Leak ----------
        function simulateLeak() {
            if (state.leakActive) {
                showToast('Leak already active', 'warning');
                return;
            }
            
            state.leakActive = true;
            document.getElementById('simulate-leak-btn').disabled = true;
            
            let step = 0;
            const interval = setInterval(() => {
                step++;
                state.currentFlow = 97.0 + (step * 3.5);
                state.currentPressure = 48.4 - (step * 0.4);
                
                updateHUD();
                updateEIS();
                
                if (step >= 4) {
                    clearInterval(interval);
                    state.currentFlow = 111.0;
                    state.currentPressure = 46.1;
                    updateHUD();
                    updateEIS();
                    
                    logEvent('ALERT', 'HYDRAULIC ANOMALY DETECTED');
                    
                    setTimeout(() => {
                        addFieldEvidence('HUMAN_VISUAL', 'OBS-FLD-001', 'Ground moisture');
                    }, 1500);
                    
                    setTimeout(() => {
                        addFieldEvidence('ACOUSTIC', 'OBS-ACO-002', '140Hz vibration');
                    }, 3000);
                }
            }, 300);
        }

        // ---------- Reset ----------
        function resetToBaseline() {
            state.leakActive = false;
            state.currentFlow = state.baselineFlow;
            state.currentPressure = state.baselinePressure;
            state.evidence = [];
            state.trustScore = 0.0;
            
            document.getElementById('simulate-leak-btn').disabled = false;
            document.getElementById('evidence-list').innerHTML = 
                '<div style="color:var(--dim);font-size:9px;text-align:center;padding:10px;">No evidence yet</div>';
            
            updateHUD();
            updateEIS();
            logEvent('INFO', 'System reset to baseline');
            showToast('System reset', 'info');
        }

        // ---------- Deploy Attestation ----------
        function deployAttestation() {
            if (!state.leakActive || state.trustScore < 0.7) {
                showToast('No verified evidence to deploy', 'error');
                return;
            }
            
            const deployBtn = document.getElementById('deploy-btn');
            deployBtn.disabled = true;
            deployBtn.textContent = 'SIGNING...';
            
            logEvent('INFO', 'ATECC608B attestation signing...');
            
            setTimeout(() => {
                const signature = '0x' + Array.from(crypto.getRandomValues(new Uint8Array(8)))
                    .map(b => b.toString(16).padStart(2, '0')).join('') + '...';
                
                logEvent('SUCCESS', 'ATTESTATION DEPLOYED');
                deployBtn.textContent = '✓ DEPLOYED';
                deployBtn.style.background = 'var(--green)';
                showToast('Evidence package sealed', 'success');
            }, 2000);
        }

        // ---------- Orientation Detection ----------
        function checkOrientation() {
            const banner = document.getElementById('rotate-banner');
            if (window.innerHeight > window.innerWidth) {
                banner.classList.add('show');
            } else {
                banner.classList.remove('show');
            }
        }

        // ---------- Initialize ----------
        function initialize() {
            // Start 3D
            animate();
            
            // Initial HUD
            updateHUD();
            updateEIS();
            
            // Add initial log entry
            logEvent('INFO', 'Mobile Tilt Command Center initialized');
            
            // Bind buttons
            document.getElementById('simulate-leak-btn').addEventListener('click', simulateLeak);
            document.getElementById('reset-btn').addEventListener('click', resetToBaseline);
            document.getElementById('deploy-btn').addEventListener('click', deployAttestation);
            
            // Tilt toggle
            document.getElementById('tilt-toggle').addEventListener('click', toggleTiltMode);
            
            // Orientation detection
            checkOrientation();
            window.addEventListener('resize', checkOrientation);
            
            // Resize handling
            function handleResize() {
                const viewport = document.querySelector('.viewport-3d');
                const width = viewport.clientWidth;
                const height = viewport.clientHeight;
                
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }
            
            window.addEventListener('resize', handleResize);
            handleResize();
        }

        // Boot
        initialize();
    </script>
</body>
</html>
