apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vvu-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  tls:
    - hosts:
        - staging.dashboard.vvu.africa
      secretName: vvu-dashboard-staging-tls
  rules:
    - host: staging.dashboard.vvu.africa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vvu-dashboard
                port:
                  name: http
