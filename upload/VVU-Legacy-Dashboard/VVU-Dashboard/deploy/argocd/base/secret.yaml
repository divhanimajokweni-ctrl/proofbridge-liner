# ── Secret template (sync wave -3)
# In production, use Sealed Secrets or External Secrets Operator.
# Run: bash deploy/argocd/scripts/seal-secrets.sh to generate sealed secrets.
apiVersion: v1
kind: Secret
metadata:
  name: vvu-dashboard-secrets
  namespace: vvu-dashboard
  labels:
    app.kubernetes.io/name: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: "SkipDryRunOnMissingResource=true"
type: Opaque
stringData:
  NEXTAUTH_SECRET: "REPLACE_WITH_SEALED_SECRET"
  DATABASE_ENCRYPTION_KEY: "REPLACE_WITH_SEALED_SECRET"
  STITCH_API_KEY: "REPLACE_WITH_SEALED_SECRET"
  STITCH_WEBHOOK_SECRET: "REPLACE_WITH_SEALED_SECRET"
  POLYGON_PRIVATE_KEY: "REPLACE_WITH_SEALED_SECRET"
  RESEND_API_KEY: "REPLACE_WITH_SEALED_SECRET"
  GITHUB_TOKEN: "REPLACE_WITH_SEALED_SECRET"
