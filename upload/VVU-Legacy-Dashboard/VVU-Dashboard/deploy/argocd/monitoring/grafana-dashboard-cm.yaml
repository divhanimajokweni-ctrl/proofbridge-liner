# ── Grafana Dashboard ConfigMap (VVU Dashboard overview) ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: vvu-monitoring
data:
  vvu-overview.json: |
    {
      "dashboard": {
        "title": "VVU Dashboard Overview",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [{ "expr": "rate(http_requests_total{app=\"vvu-dashboard\"}[1m])" }]
          },
          {
            "title": "Pod CPU",
            "type": "gauge",
            "datasource": "Prometheus",
            "targets": [{ "expr": "rate(container_cpu_usage_seconds_total{namespace=\"vvu-dashboard\"}[1m])" }]
          },
          {
            "title": "Pod Memory",
            "type": "gauge",
            "datasource": "Prometheus",
            "targets": [{ "expr": "container_memory_working_set_bytes{namespace=\"vvu-dashboard\"}" }]
          },
          {
            "title": "Pod Status",
            "type": "stat",
            "datasource": "Prometheus",
            "targets": [{ "expr": "kube_pod_status_phase{namespace=\"vvu-dashboard\"}" }]
          }
        ]
      }
    }
