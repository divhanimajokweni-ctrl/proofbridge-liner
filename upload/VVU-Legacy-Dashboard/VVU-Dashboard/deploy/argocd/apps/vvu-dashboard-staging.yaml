apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vvu-dashboard-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vvu
  source:
    repoURL: https://github.com/vvu/proofbridge-liner.git
    targetRevision: main
    path: deploy/argocd/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: vvu-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
