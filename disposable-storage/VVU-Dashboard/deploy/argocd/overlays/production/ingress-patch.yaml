apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vvu-dashboard
spec:
  tls:
    - hosts:
        - dashboard.vvu.africa
      secretName: vvu-dashboard-tls
  rules:
    - host: dashboard.vvu.africa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vvu-dashboard
                port:
                  name: http
