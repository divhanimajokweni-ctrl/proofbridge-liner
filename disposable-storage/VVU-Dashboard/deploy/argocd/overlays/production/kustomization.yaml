apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vvu-dashboard-production
namespace: vvu-dashboard
resources:
  - ../../base
patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
  - path: configmap-patch.yaml
configMapGenerator:
  - name: vvu-dashboard-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - POLYGON_CHAIN=mainnet
      - POLYGON_RPC_URL=https://polygon-rpc.com
      - LOG_LEVEL=info
images:
  - name: vvu/dashboard
    newTag: production
