apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vvu-dashboard-staging
namespace: vvu-staging
resources:
  - ../../base
patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
  - path: configmap-patch.yaml
configMapGenerator:
  - name: vvu-dashboard-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - POLYGON_CHAIN=amoy
      - POLYGON_RPC_URL=https://rpc-amoy.polygon.technology
      - LOG_LEVEL=debug
images:
  - name: vvu/dashboard
    newTag: staging
