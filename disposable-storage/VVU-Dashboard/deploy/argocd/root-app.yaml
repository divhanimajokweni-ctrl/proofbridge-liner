# VVU Production Dashboard — Root App-of-Apps
# Apply this first: kubectl apply -f deploy/argocd/root-app.yaml
# Argo CD will then automatically create all child applications.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vvu-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vvu/proofbridge-liner.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Project for VVU applications
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vvu
  namespace: argocd
spec:
  description: Venture Vision Ubuntu — Production Dashboard
  sourceRepos:
    - https://github.com/vvu/proofbridge-liner.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: vvu-dashboard
    - server: https://kubernetes.default.svc
      namespace: vvu-monitoring
    - server: https://kubernetes.default.svc
      namespace: vvu-staging
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
