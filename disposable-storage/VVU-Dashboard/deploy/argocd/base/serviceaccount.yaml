# ── ServiceAccount + RBAC (sync wave -5) ──
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vvu-dashboard
  namespace: vvu-dashboard
  labels:
    app.kubernetes.io/name: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vvu-dashboard
  namespace: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vvu-dashboard
  namespace: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vvu-dashboard
subjects:
  - kind: ServiceAccount
    name: vvu-dashboard
    namespace: vvu-dashboard
