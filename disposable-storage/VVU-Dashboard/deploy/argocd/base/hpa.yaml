# ── HPA (sync wave 1: after deployment) ──
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vvu-dashboard
  namespace: vvu-dashboard
  labels:
    app.kubernetes.io/name: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vvu-dashboard
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
# ── Pod Disruption Budget (sync wave 1) ──
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vvu-dashboard
  namespace: vvu-dashboard
  labels:
    app.kubernetes.io/name: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vvu-dashboard
