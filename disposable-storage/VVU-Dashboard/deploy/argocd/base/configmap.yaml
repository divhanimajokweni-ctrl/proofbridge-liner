# ── ConfigMap (sync wave -3: before deployment) ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: vvu-dashboard-config
  namespace: vvu-dashboard
  labels:
    app.kubernetes.io/name: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  NODE_ENV: "production"
  NEXTAUTH_URL: "https://dashboard.vvu.africa"
  NATS_URL: "nats://nats.vvu-dashboard:4222"
  POLYGON_RPC_URL: "https://rpc-amoy.polygon.technology"
  POLYGON_CHAIN: "amoy"
  GOVERNANCE_ANCHOR_ADDRESS: ""
  DATABASE_URL: "file:./prisma/vvu.db"
  LOG_LEVEL: "info"
  COMPLIANCE_MODE: "popia"
  EPISTEMIC_RUNTIME_VERSION: "v0.8"
  UBUNTU_POOLS_STATUS: "online"
  STITCH_WEBHOOK_URL: ""
  PROOFBRIDGE_VERSION: "v2.1.0"
