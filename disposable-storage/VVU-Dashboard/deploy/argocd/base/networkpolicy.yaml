# ── NetworkPolicy (sync wave -2: before pods) ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vvu-dashboard
  namespace: vvu-dashboard
  labels:
    app.kubernetes.io/name: vvu-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vvu-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              name: vvu-monitoring
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # HTTPS outbound (APIs, Polygon RPC, Stitch, Resend)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # NATS (if in-cluster)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
