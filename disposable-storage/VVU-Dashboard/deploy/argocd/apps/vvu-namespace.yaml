apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vvu-namespace
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vvu
  source:
    repoURL: https://github.com/vvu/proofbridge-liner.git
    targetRevision: main
    path: deploy/argocd/base
  destination:
    server: https://kubernetes.default.svc
    namespace: vvu-dashboard
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
