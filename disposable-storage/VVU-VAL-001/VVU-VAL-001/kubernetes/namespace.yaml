# VVU-VAL-001 · Namespace Layout (Provider-Agnostic k3s)
#
# 8 namespaces. Layer 1 (validation) owns the first 7; Layer 2 (outreach)
# owns the 8th and is killable without affecting the run.
#
# Apply with: kubectl apply -f kubernetes/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: vvu-runtime
  labels: { layer: "validation", role: "runtime" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: epistemic
  labels: { layer: "validation", role: "epistemic" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: air
  labels: { layer: "validation", role: "air-kernel" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: evidence
  labels: { layer: "validation", role: "evidence" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels: { layer: "validation", role: "monitoring" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: streaming
  labels: { layer: "validation", role: "streaming" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos
  labels: { layer: "validation", role: "chaos-injection" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: outreach
  labels: { layer: "outreach", role: "outreach", killable: "true" }
