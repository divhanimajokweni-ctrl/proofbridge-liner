# VVU-VAL-001 · Monitoring Namespace
# Prometheus + Grafana for metrics collection and dashboard visualization.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prometheus-pvc, namespace: monitoring }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring, labels: { app: prometheus } }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prom
          image: prom/prometheus:v2.51.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/data"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: prometheus-pvc } }
        - { name: config, configMap: { name: prometheus-config } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring, labels: { app: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "vvu-val" }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
