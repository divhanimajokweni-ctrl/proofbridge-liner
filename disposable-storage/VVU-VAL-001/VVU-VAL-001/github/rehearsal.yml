# VVU-VAL-001 · Rehearsal Workflow
# Runs the private dress rehearsal on demand. Must pass before the public run.
name: VVU-VAL-001 Dress Rehearsal

on:
  workflow_dispatch:
    inputs:
      phase_only: { description: "Single phase (P1-P7) or empty for full run", required: false, type: string }

permissions: { contents: write, packages: read }

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    environment: rehearsal
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.VVU_VAL_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Run rehearsal
        run: |
          chmod +x validation/VVU-VAL-001/rehearsal/run-rehearsal.sh
          if [ -n "${{ github.event.inputs.phase_only }}" ]; then
            bash validation/VVU-VAL-001/rehearsal/run-rehearsal.sh --phase-only "${{ github.event.inputs.phase_only }}"
          else
            bash validation/VVU-VAL-001/rehearsal/run-rehearsal.sh
          fi

      - name: Run verification
        run: |
          chmod +x validation/VVU-VAL-001/rehearsal/verify.sh
          bash validation/VVU-VAL-001/rehearsal/verify.sh || echo "::warning::verification reported issues"

      - name: Freeze build (if rehearsal passed)
        if: success()
        run: |
          chmod +x validation/VVU-VAL-001/rehearsal/freeze-build.sh
          bash validation/VVU-VAL-001/rehearsal/freeze-build.sh

      - name: Upload frozen-build.json
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-build
          path: validation/VVU-VAL-001/protocol/frozen-build.json
