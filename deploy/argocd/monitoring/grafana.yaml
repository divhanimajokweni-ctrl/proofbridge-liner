# ── Grafana ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: vvu-monitoring
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "vvu-admin" }
            - { name: GF_INSTALL_PLUGINS, value: "" }
          volumeMounts:
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true }
      volumes:
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: provisioning, configMap: { name: grafana-provisioning } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: vvu-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: VVU Dashboards
        folder: VVU
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: vvu-monitoring
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
