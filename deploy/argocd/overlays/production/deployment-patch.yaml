apiVersion: apps/v1
kind: Deployment
metadata:
  name: vvu-dashboard
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: dashboard
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/stats
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/stats
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
