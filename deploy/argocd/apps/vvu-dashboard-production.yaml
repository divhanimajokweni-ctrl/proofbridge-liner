apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vvu-dashboard-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vvu
  source:
    repoURL: https://github.com/divhanimajokweni-ctrl/proofbridge-liner.git
    targetRevision: main
    path: deploy/argocd/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: vvu-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
