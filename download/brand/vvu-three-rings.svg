<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- VVU Three Rings Logo — interlocking triangular formation -->
  <!-- Ring 1: Trust (gold) — top -->
  <circle cx="100" cy="65" r="42" stroke="#D4AF37" stroke-width="8" fill="none" opacity="0.9"/>
  <!-- Ring 2: Innovation (cyan) — bottom left -->
  <circle cx="65" cy="130" r="42" stroke="#00d4ff" stroke-width="8" fill="none" opacity="0.9"/>
  <!-- Ring 3: Impact (green) — bottom right -->
  <circle cx="135" cy="130" r="42" stroke="#00ff88" stroke-width="8" fill="none" opacity="0.9"/>
  <!-- Center convergence point -->
  <circle cx="100" cy="108" r="5" fill="#D4AF37" opacity="0.8"/>
  <!-- Brand text -->
  <text x="100" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#D4AF37" letter-spacing="2">VENTURE VISION UBUNTU</text>
  <text x="100" y="197" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#5b7280" letter-spacing="1">TRUST · INNOVATION · IMPACT</text>
</svg>
