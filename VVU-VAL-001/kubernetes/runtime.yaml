# VVU-VAL-001 · Runtime Namespace Deployments
#
# Epistemic Runtime, AIR Kernel, NATS JetStream, telemetry generator,
# security injector. All write to persistent volumes — nothing in-memory only.
#
# Image pinning: at freeze time, freeze-build.sh patches the image references
# from tag (:VAL-001) to digest (@sha256:...) for maximum reproducibility.

# ── Persistent Volume Claims ──
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: fact-log-pvc, namespace: vvu-runtime }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mmr-pvc, namespace: vvu-runtime }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: nats-pvc, namespace: vvu-runtime }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 20Gi } }
---
# ── Epistemic Runtime ──
# Image is patched to digest by freeze-build.sh at freeze time
apiVersion: apps/v1
kind: Deployment
metadata: { name: epistemic-runtime, namespace: vvu-runtime, labels: { app: runtime } }
spec:
  replicas: 1
  selector: { matchLabels: { app: runtime } }
  template:
    metadata: { labels: { app: runtime } }
    spec:
      containers:
        - name: runtime
          image: vvu/epistemic-runtime@unknown (no container runtime)
          ports: [{ containerPort: 3000 }]
          env:
            - { name: NATS_URL, value: "nats://nats:4222" }
            - { name: RUNTIME_NS, value: "vvu-runtime" }
          volumeMounts:
            - { name: fact-log, mountPath: /var/lib/vvu/fact-log }
            - { name: mmr, mountPath: /var/lib/vvu/mmr }
          readinessProbe: { httpGet: { path: /api/stats, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/stats, port: 3000 }, periodSeconds: 30 }
      volumes:
        - { name: fact-log, persistentVolumeClaim: { claimName: fact-log-pvc } }
        - { name: mmr, persistentVolumeClaim: { claimName: mmr-pvc } }
---
apiVersion: v1
kind: Service
metadata: { name: epistemic-runtime, namespace: vvu-runtime }
spec:
  selector: { app: runtime }
  ports: [{ port: 80, targetPort: 3000 }]
---
# ── AIR Kernel ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: air-kernel, namespace: vvu-runtime, labels: { app: air-kernel } }
spec:
  replicas: 1
  selector: { matchLabels: { app: air-kernel } }
  template:
    metadata: { labels: { app: air-kernel } }
    spec:
      containers:
        - name: air
          image: vvu/air-kernel:VAL-001  # → @sha256:... after freeze
          env:
            - { name: NATS_URL, value: "nats://nats:4222" }
---
# ── NATS JetStream (durable queue) ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: nats, namespace: vvu-runtime, labels: { app: nats } }
spec:
  replicas: 1
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      containers:
        - name: nats
          image: nats:2.10
          args: ["-js", "-sd", "/data"]
          ports: [{ containerPort: 4222 }, { containerPort: 8222 }]
          volumeMounts: [{ name: nats-data, mountPath: /data }]
      volumes: [{ name: nats-data, persistentVolumeClaim: { claimName: nats-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: nats, namespace: vvu-runtime }
spec:
  selector: { app: nats }
  ports: [{ name: client, port: 4222 }, { name: monitor, port: 8222 }]
---
# ── Telemetry generator (load) ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: telemetry-generator, namespace: vvu-runtime, labels: { app: telemetry-generator } }
spec:
  replicas: 1
  selector: { matchLabels: { app: telemetry-generator } }
  template:
    metadata: { labels: { app: telemetry-generator } }
    spec:
      containers:
        - name: gen
          image: vvu/telemetry-generator:VAL-001
          env:
            - { name: TARGET, value: "http://epistemic-runtime/v1/telemetry" }
            - { name: RATE_MULT, value: "1" }  # chaos driver ramps this in P2
---
# ── Security injector (P6 — scaled to 0 until P6) ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: security-injector, namespace: vvu-runtime, labels: { app: security-injector } }
spec:
  replicas: 0  # scaled up by inject-security.sh in P6
  selector: { matchLabels: { app: security-injector } }
  template:
    metadata: { labels: { app: security-injector } }
    spec:
      containers:
        - name: inj
          image: vvu/security-injector:VAL-001
          env:
            - { name: TARGET, value: "http://epistemic-runtime/v1/telemetry" }
