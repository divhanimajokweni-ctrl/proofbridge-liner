# VVU-VAL-001 · Validation Runtime — Epistemic Runtime
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epistemic-runtime
  namespace: vvu-runtime
  labels:
    app.kubernetes.io/name: epistemic-runtime
    app.kubernetes.io/component: runtime
    priority-tier: critical
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epistemic-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epistemic-runtime
        priority-tier: critical
    spec:
      priorityClassName: validation-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: runtime
          image: vvu/epistemic-runtime:PLACEHOLDER  # pin-to-digest by freeze-build.sh; non-rehearsal requires sealed manifest
          ports:
            - containerPort: 3000
          env:
            - { name: NATS_URL, value: "nats://nats.vvu-runtime:4222" }
            - { name: RUNTIME_NS, value: "vvu-runtime" }
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - { name: fact-log, mountPath: /var/lib/vvu/fact-log }
            - { name: mmr, mountPath: /var/lib/vvu/mmr }
          readinessProbe:
            httpGet:
              path: /api/stats
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/stats
              port: 3000
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - { name: fact-log, persistentVolumeClaim: { claimName: fact-log-pvc } }
        - { name: mmr, persistentVolumeClaim: { claimName: mmr-pvc } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fact-log-pvc
  namespace: vvu-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mmr-pvc
  namespace: vvu-runtime
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeMode: Filesystem
