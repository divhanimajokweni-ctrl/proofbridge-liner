# VVU-VAL-001 · Streaming Namespace
# Headless streaming service captures Grafana dashboard for public broadcast.
# Supporting evidence only; validation integrity does not depend on this pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: video-pvc
  namespace: streaming
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
  volumeMode: Filesystem
  ### If needed in production, convert to ReadWriteMany with a shared filesystem.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: streaming
  labels:
    app.kubernetes.io/name: streaming-service
    priority-tier: lowest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streaming-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streaming-service
        priority-tier: lowest
    spec:
      priorityClassName: validation-lowest
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamer
          image: vvu/headless-streaming-service:PLACEHOLDER  # pin-to-digest by freeze-build.sh
          env:
            - { name: STREAM_KEY, valueFrom: { secretKeyRef: { name: stream-key, key: key } } }
            - { name: GRAFANA_URL, value: "http://grafana.monitoring:3000" }
            - { name: STREAM_TARGET, value: "youtube" }
            - { name: RESOLUTION, value: "1080p" }
            - { name: FRAMERATE, value: "30" }
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - { name: video, mountPath: /recordings }
      volumes:
        - { name: video, persistentVolumeClaim: { claimName: video-pvc } }
