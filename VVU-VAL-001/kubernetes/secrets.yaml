# VVU-VAL-001 · Validation Secret Bootstrap
# Use Sealed Secrets or External Secrets in production.
# For rehearsal/local environments only: placeholder values must be rotated before first run.
apiVersion: v1
kind: Secret
metadata:
  name: vvu-validation-secrets
  namespace: vvu-runtime
  labels:
    app.kubernetes.io/part-of: VVU-VAL-001
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  NATS_ACCOUNT: "REPLACE_WITH_SEALED_SECRET"
  TELEMETRY_API_KEY: "REPLACE_WITH_SEALED_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: stream-key
  namespace: streaming
  labels:
    app.kubernetes.io/part-of: VVU-VAL-001
type: Opaque
stringData:
  key: "REPLACE_WITH_SEALED_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: VVU-VAL-001
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_WITH_SEALED_SECRET"
