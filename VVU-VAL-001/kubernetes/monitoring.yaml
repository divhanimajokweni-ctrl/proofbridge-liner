# VVU-VAL-001 · Monitoring Namespace
# Prometheus + Grafana with Secret-backed admin password and Provider-agnostic manifests.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    priority-tier: high
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        priority-tier: high
    spec:
      priorityClassName: validation-high
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: prom
          image: prom/prometheus:v2.51.0
          args:
            [
              "--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.path=/data",
            ]
          ports:
            - { containerPort: 9090 }
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: prometheus-pvc } }
        - { name: config, configMap: { name: prometheus-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - { port: 9090, targetPort: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    priority-tier: high
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        priority-tier: high
    spec:
      priorityClassName: validation-high
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - { containerPort: 3000 }
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: monitoring-secrets, key: GF_SECURITY_ADMIN_PASSWORD } } }
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true }
      volumes:
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: provisioning, configMap: { name: grafana-provisioning } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - { port: 3000, targetPort: 3000 }
