services:
  whatsapp-daemon:
    build: .
    container_name: proofbridge_whatsapp_worker
    restart: always
    environment:
      - NODE_ENV=production
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - WHATSAPP_AUTH_DIR=auth_store_whatsapp
      - WHATSAPP_HEALTH_PORT=3001
      - WHATSAPP_ADMIN_PHONES=${WHATSAPP_ADMIN_PHONES}
      - SLACK_OPERATIONAL_WEBHOOK_URL=${SLACK_OPERATIONAL_WEBHOOK_URL}
      - DISCORD_OPERATIONAL_WEBHOOK_URL=${DISCORD_OPERATIONAL_WEBHOOK_URL}
      - STITCH_CLIENT_ID=${STITCH_CLIENT_ID}
      - STITCH_CLIENT_SECRET=${STITCH_CLIENT_SECRET}
      - STITCH_WEBHOOK_SECRET=${STITCH_WEBHOOK_SECRET}
    volumes:
      - ./auth_store_whatsapp:/usr/src/app/auth_store_whatsapp
      - ./logs:/usr/src/app/logs
    networks:
      - openclaw-net

  kilo-runtime:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - JURISDICTION=proofbridge
    env_file: ./secrets/.env.proofbridge
    volumes:
      - ./.kilocode:/app/.kilocode:ro
      - ./kilo.json:/app/kilo.json:ro
      - ./jurisdiction-manifest.yaml:/app/jurisdiction-manifest.yaml:ro
      - ./active:/app/active
    networks:
      - proofbridge-net
    restart: unless-stopped

  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - JURISDICTION=lindiwe-openclaw
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    env_file: ./secrets/.env.openclaw
    volumes:
      - ./openclaw.json:/app/openclaw.json:ro
      - ./jurisdiction-manifest.yaml:/app/jurisdiction-manifest.yaml:ro
    networks:
      - openclaw-net

networks:
  proofbridge-net: {}
  openclaw-net: {}
