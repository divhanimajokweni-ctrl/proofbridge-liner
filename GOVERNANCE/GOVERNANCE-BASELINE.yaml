# GOVERNANCE-BASELINE.yaml — GB-1.0
#
# This file defines the frozen governance baseline for VVU.
# It is cryptographically signed — see TRUST-ROOT-DISCLOSURE.md for what
# that proves at each governance stage.
#
# The canonical byte representation that gets signed is the compact JSON
# serialization of this file. The .yaml format is for human readers; the
# .signed.json artifact in GOVERNANCE/signed/ is what CI and audit tools
# actually verify.
#
# To sign a new baseline:
#   npx tsx scripts/governance/sign-registry.ts \
#     --registry GOVERNANCE/GOVERNANCE-BASELINE.yaml \
#     --publish GOVERNANCE/signed/

baseline:
  version: "GB-1.0"
  date: "2026-07-02"
  status: "frozen"
  supersedes: null

governance:
  stage: "Stage0SingleKey"  # See TRD-1.0 for stage definitions
  trust_root: "GOVERNANCE/TRUST-ROOT-DISCLOSURE.md"
  trusted_signer: "GOVERNANCE/TRUSTED-SIGNER-GB-1.0.pem"
  signing_key_custody: "SafeKrypte root key (port 5096)"
  signing_key_path: "SafeKrypte"  # Key is never on disk in CI

components:
  - id: OBREG-1.0
    name: "Obligation Registry"
    path: "GOVERNANCE/OBLIGATION-REGISTRY.yaml"
    signed_artifact: "GOVERNANCE/signed/obligation-registry.signed.json"
    status: "signed"
    verification_method: "Ed25519 via @noble/ed25519"

  - id: TRD-1.0
    name: "Trust Root Disclosure"
    path: "GOVERNANCE/TRUST-ROOT-DISCLOSURE.md"
    status: "published"
    verification_method: "Read TRD-1.0 — describes what signing proves at each stage"

  - id: COMPAT-1.0
    name: "Compatibility Engine"
    path: "lib/governance/compatibility.ts"
    status: "implemented"
    verification_method: "npm test -- --testPathPattern=governance/compatibility"

  - id: QUORUM-1.0
    name: "Quorum Registry"
    path: "lib/governance/quorum-registry.ts"
    status: "implemented"
    verification_method: "npm test -- --testPathPattern=governance/quorum"

obligations:
  - id: OB-000001
    name: "Right to Independent Verification"
    normative: "MUST"
    description: >
      Any participant MUST be able to independently verify the integrity
      of the Obligation Registry without trusting VVU servers.
    current_article: "IV.2"
    historical_articles: ["IV.2"]
    introduced: "Charter v7.0"
    amended: []
    capability: "CAP-VERIFICATION"
    policy: "POL-RIGHTS-001"

  - id: OB-000023
    name: "Separate Governance Functions"
    normative: "MUST"
    description: >
      Governance signing MUST use the same trust root as operational
      signing (SafeKrypte), scoped by key-derivation path, not a new key.
    current_article: "IV.4"
    historical_articles: ["IV.4"]
    introduced: "Charter v7.0"
    amended: []
    capability: "CAP-GOVERNANCE"
    policy: "POL-GOV-001"

  - id: OB-000047
    name: "Governance Transition Transparency"
    normative: "SHOULD"
    description: >
      Baseline transitions SHOULD be published as signed artifacts with
      auditable transition records before taking effect.
    current_article: "IX.1"
    historical_articles: ["IX.1"]
    introduced: "GB-1.0"
    amended: []
    capability: "CAP-GOVERNANCE"
    policy: "POL-GOV-002"

compatibility:
  # RFC 2119 transition rules — enforced by lib/governance/compatibility.ts
  # See COMPATIBILITY-RULES.yaml for the full rule set.
  rule_a: "Any polarity flip (positive↔negative) is BREAKING"
  rule_b: "Any strength decrease leaving or crossing the Binding tier is BREAKING"
  rule_c: "Obligation removal is always BREAKING"
  rule_d: "New obligations start as ConditionallyCompatible"
  transition_periods:
    Compatible: 0 days
    ConditionallyCompatible: 90 days
    Breaking: 180 days

# The hash below is a placeholder. Run the following after signing:
#   npx tsx scripts/governance/sign-registry.ts \
#     --registry GOVERNANCE/GOVERNANCE-BASELINE.yaml \
#     --publish GOVERNANCE/signed/
# Then update this hash from the signed artifact.
signature:
  payload_hash: null  # Set by sign-registry.ts
  signed_artifact: "GOVERNANCE/signed/gb-1.0.signed.json"
