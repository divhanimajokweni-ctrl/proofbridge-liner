# OBLIGATION-REGISTRY.yaml — GB-1.0 Obligation Registry
#
# This file is the authoritative list of governance obligations.
# It MUST be signed with the SafeKrypte root key before CI or audit tools
# will accept it. See TRUST-ROOT-DISCLOSURE.md and signed-registry.ts.
#
# To sign:
#   npx tsx scripts/governance/sign-registry.ts \
#     --registry GOVERNANCE/OBLIGATION-REGISTRY.yaml \
#     --publish GOVERNANCE/signed/

baseline_version: "GB-1.0"

obligations:
  OB-000001:
    id: "OB-000001"
    name: "Right to Independent Verification"
    normative: "MUST"
    description: "Any participant MUST be able to independently verify the integrity of the Obligation Registry without trusting VVU servers."
    current_article: "IV.2"
    historical_articles: ["IV.2"]
    introduced: "Charter v7.0"
    amended: []
    capability: "CAP-VERIFICATION"
    policy: "POL-RIGHTS-001"

  OB-000023:
    id: "OB-000023"
    name: "Separate Governance Functions"
    normative: "MUST"
    description: "Governance signing MUST use the same trust root as operational signing (SafeKrypte), scoped by key-derivation path, not a new key."
    current_article: "IV.4"
    historical_articles: ["IV.4"]
    introduced: "Charter v7.0"
    amended: []
    capability: "CAP-GOVERNANCE"
    policy: "POL-GOV-001"

  OB-000047:
    id: "OB-000047"
    name: "Governance Transition Transparency"
    normative: "SHOULD"
    description: "Baseline transitions SHOULD be published as signed artifacts with auditable transition records before taking effect."
    current_article: "IX.1"
    historical_articles: ["IX.1"]
    introduced: "GB-1.0"
    amended: []
    capability: "CAP-GOVERNANCE"
    policy: "POL-GOV-002"
