[pytest]
# VVU Earth Ledger — Pytest Configuration
# https://docs.pytest.org/en/stable/reference/customize.html

testpaths = tests
addopts = -v --tb=short

# ── Custom markers ────────────────────────────────────────────────────
markers =
    unit: Unit tests (fast, isolated, no I/O)
    integration: Integration tests (multi-component, may use I/O)
    replay: Replay verification tests (deterministic replay)
    crypto: Cryptographic operation tests (signing, hashing, key generation)
    adversarial: Adversarial / fuzz tests (mutation, boundary, chaos)
    benchmark: Performance benchmark tests (timing, throughput)

# ── Test discovery ────────────────────────────────────────────────────
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Logging ───────────────────────────────────────────────────────────
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ── Coverage (when using pytest-cov) ─────────────────────────────────
# Run with: pytest --cov=production_ledger --cov-report=term-missing
