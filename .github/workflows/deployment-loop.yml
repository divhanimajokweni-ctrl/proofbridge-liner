name: Deployment Lock Loop

on:
  push:
    branches: [main, compliance-fabric]
  workflow_dispatch:

concurrency:
  group: deployment-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit-gate:
    name: 1 - Commit Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify critical files
        run: |
          for f in app/api/verify/route.ts app/api/mint/route.ts middleware.ts AGENTS.md .vercelignore; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done

  build-gate:
    name: 2 - Build Gate
    needs: commit-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@11.11.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  deploy:
    name: 3 - Vercel Deploy
    needs: build-gate
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@11.11.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm add -g vercel
      - run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - run: vercel build --prod --token=$VERCEL_TOKEN
      - run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
      - name: Capture deploy URL
        run: |
          URL=$(vercel inspect --prod --token=$VERCEL_TOKEN | grep -oP 'https://[^\s]+\.vercel\.app' | head -1)
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV

  verify:
    name: 4 - DNS + Health Verification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: DNS resolution
        run: |
          apt-get update -qq && apt-get install -y -qq dnsutils 2>/dev/null || true
          dig +short venturevisionubuntu.co.za || echo "DNS check non-fatal"
      - name: Health check
        run: |
          curl -s -o /dev/null -w "Health: HTTP %{http_code}\n" https://venturevisionubuntu.co.za/api/health || true

  finalize:
    name: 5 - Docs + Checklist + Push
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update DEPLOY_LOG.md
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          cat >> DEPLOY_LOG.md <<EOF
          ## $TIMESTAMP
          - **Commit**: \`$COMMIT_HASH\`
          - **Status**: Deployed via CI
          - **Domain**: https://venturevisionubuntu.co.za

          EOF
      - name: Generate DEPLOYMENT_CHECKLIST.md
        run: |
          cat > DEPLOYMENT_CHECKLIST.md <<'CHKEOF'
          # Deployment Checklist

          ## Pre-Push
          - [x] All changes committed with meaningful messages
          - [x] Critical files present (verify, mint, middleware, AGENTS.md)

          ## Build
          - [x] `pnpm run build` passes without errors

          ## Deploy
          - [x] Pushed to origin
          - [x] Vercel production deploy succeeded
          - [x] Domain alias active

          ## Verify
          - [x] DNS resolves correctly
          - [x] Health endpoint responding

          ## Docs
          - [ ] README build reference updated
          - [ ] DEPLOY_LOG.md entry created
          - [ ] Documentation files reviewed
          CHKEOF
      - name: Commit and push loop artifacts
        run: |
          git config user.name "deployment-lock-bot"
          git config user.email "deploy@proofbridge-liner.vercel.app"
          git add DEPLOY_LOG.md DEPLOYMENT_CHECKLIST.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: deployment loop artifacts [skip ci]"
            git push
          fi
