name: Deploy Verification Gate

# VVU Evidence Office — Server‑Side Enforcement with Trust Chain
#
# Triggers on any PR or push that modifies DEPLOY_LOG.md.
# 1. Verifies the signed script manifest and hashes.
# 2. Runs the full pipeline.
# 3. Cross‑checks DEPLOY_LOG.md claims against real results.
# 4. Performs a structured health check with commit SHA verification.
# 5. Generates a signed evidence envelope and uploads as artifact.
# 6. Blocks merges on any mismatch or verification failure.
#
# Status: Specification complete — pending repository injection and
#         configuration of branch protection, CODEOWNERS, and secrets.

on:
  pull_request:
    paths:
      - 'DEPLOY_LOG.md'
  push:
    branches: [main]
    paths:
      - 'DEPLOY_LOG.md'

env:
  PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL || 'https://venturevisionubuntu.co.za/api/health' }}

permissions:
  contents: read
  actions: write       # needed for artifact upload
  id-token: write      # if using OIDC
  pull-requests: write # if commenting on PRs

jobs:
  # ─── Trust Chain Verification ───
  verify-trust-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest signature
        run: |
          echo "$MANIFEST_PUBLIC_KEY" > /tmp/manifest-pub.pem
          node packages/trust-crypto/dist/verify.js \
            .manifest.json .manifest.json.sig \
            --public-key /tmp/manifest-pub.pem
        env:
          MANIFEST_PUBLIC_KEY: ${{ secrets.MANIFEST_PUBLIC_KEY }}

      - name: Verify script hashes against manifest
        run: |
          for script in $(jq -r '.approvedScripts[].path' .manifest.json); do
            expected=$(jq -r ".approvedScripts[] | select(.path==\"$script\") | .sha256" .manifest.json)
            actual=$(sha256sum "$script" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "::error::$script hash mismatch. Expected $expected, got $actual."
              exit 1
            fi
          done
          echo "✅ All scripts verified against manifest."

  # ─── Pipeline & Fabrication Check ───
  verify-and-gate:
    needs: verify-trust-chain
    runs-on: ubuntu-latest
    outputs:
      evidence_hash: ${{ steps.evidence.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Type check
        id: typecheck
        run: npx tsc --noEmit 2>&1 | tee typecheck.log

      - name: Lint
        id: lint
        run: npm run lint 2>&1 | tee lint.log

      - name: Test
        id: test
        run: |
          npm test -- --reporter=json > test-results.json 2>test-errors.log

      - name: Build
        id: build
        run: npm run build

      - name: Extract real test counts
        id: real
        run: |
          TESTS_PASSED=$(jq '.numPassedTests // 0' test-results.json)
          TESTS_TOTAL=$(jq '.numTotalTests // 0' test-results.json)
          echo "tests_passed=$TESTS_PASSED" >> "$GITHUB_OUTPUT"
          echo "tests_total=$TESTS_TOTAL" >> "$GITHUB_OUTPUT"

      # ─── Structured Health Check (main only) ───
      - name: Production health check
        id: health
        if: github.ref == 'refs/heads/main'
        run: |
          HTTP_CODE=$(curl -s -o health.json -w "%{http_code}" "$PROD_HEALTH_URL")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health endpoint returned $HTTP_CODE. Cannot claim 'Deployed'."
            exit 1
          fi
          READY=$(jq -r '.ready // false' health.json)
          COMMIT_SHA=$(jq -r '.commitSha // empty' health.json)
          # Verify the deployed commit matches this workflow's commit
          if [ "$COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Health endpoint reports commit $COMMIT_SHA, expected $GITHUB_SHA."
            exit 1
          fi
          if [ "$READY" != "true" ]; then
            echo "::error::Health endpoint reports ready=false."
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # ─── Determine diff base ───
      - name: Determine diff base
        id: diffbase
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          else
            BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "4b825dc642cb6eb9a060e54bf8b4d0a2b1b2b0b0")
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      # ─── Fabrication Check ───
      - name: Cross-check DEPLOY_LOG.md diff
        run: |
          BASE="${{ steps.diffbase.outputs.base }}"
          git diff "$BASE" -- DEPLOY_LOG.md > diff.patch
          echo "--- Diff ---"
          cat diff.patch

          ADDED_TESTS=$(grep '^+' diff.patch | grep -i 'Tests' || true)
          REAL="${{ steps.real.outputs.tests_passed }}/${{ steps.real.outputs.tests_total }}"
          if [ -n "$ADDED_TESTS" ] && ! echo "$ADDED_TESTS" | grep -q "$REAL"; then
            echo "::error::DEPLOY_LOG.md claims test numbers that don't match this pipeline ($REAL)."
            exit 1
          fi

          ADDED_DEPLOY=$(grep '^+' diff.patch | grep -iE 'deploy|status' || true)
          if echo "$ADDED_DEPLOY" | grep -qi 'deployed'; then
            if [ "${{ steps.health.outcome }}" != "success" ]; then
              echo "::error::DEPLOY_LOG.md claims 'Deployed' but health check failed or skipped."
              exit 1
            fi
          fi

          echo "✅ All DEPLOY_LOG.md claims verified."

      # ─── Signed Evidence Envelope ───
      - name: Generate and sign evidence envelope
        id: evidence
        run: |
          ENVELOPE=$(jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg hash_algo "sha256" \
            '{commit: $commit, run_id: $run, timestamp: $timestamp, hash_algo: $hash_algo}')
          echo "$ENVELOPE" > evidence-envelope.json
          COMBINED=$(cat evidence-envelope.json diff.patch test-results.json health.json 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "hash=$COMBINED" >> "$GITHUB_OUTPUT"
          echo "Evidence hash: $COMBINED"
          echo "$COMBINED" > evidence-hash.txt
          # Sign the hash using the evidence signing key
          echo "$COMBINED" | node packages/trust-crypto/dist/sign.js --key "$EVIDENCE_SIGNING_KEY" > evidence-envelope.sig
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: |
            diff.patch
            test-results.json
            health.json
            evidence-envelope.json
            evidence-envelope.sig
            evidence-hash.txt
          retention-days: 90

  # ─── Merge Gate ───
  block-merge-on-fabrication:
    needs: verify-and-gate
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Reject merge
        run: |
          echo "This PR/commit introduces a fabricated or unverified DEPLOY_LOG.md entry,"
          echo "or failed trust chain verification. Correct the issue and retry."
          exit 1
