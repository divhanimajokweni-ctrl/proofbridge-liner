name: Deploy Verification Gate

on:
  pull_request:
    paths:
      - 'DEPLOY_LOG.md'
  push:
    branches: [main]
    paths:
      - 'DEPLOY_LOG.md'

concurrency:
  group: deploy-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-fabrication:
    name: Block Fabricated Deployment Claims
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract claimed commit from DEPLOY_LOG.md diff
        id: extract-claim
        run: |
          # Get the new line(s) added to DEPLOY_LOG.md
          DIFF=$(git diff HEAD^ HEAD -- DEPLOY_LOG.md || echo "")
          
          # Find any "- **Status**:" claims that say "Deployed"
          if echo "$DIFF" | grep -qi "Deployed\|PASS"; then
            echo "has_deployment_claim=true" >> "$GITHUB_OUTPUT"
            STATUS_CLAIM=$(echo "$DIFF" | grep -i "Status" | head -1 || echo "unknown")
            echo "status_claim=$STATUS_CLAIM" >> "$GITHUB_OUTPUT"
            
            # Extract commit SHA from the claim
            CLAIMED_SHA=$(echo "$DIFF" | grep -oP "(?<=Commit.*: \`)[a-f0-9]{7}(?=\`)" | head -1 || echo "unknown")
            echo "claimed_sha=$CLAIMED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "has_deployment_claim=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify claimed commit's actual CI status
        if: steps.extract-claim.outputs.has_deployment_claim == 'true'
        id: verify-status
        env:
          CLAIMED_SHA: ${{ steps.extract-claim.outputs.claimed_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying commit: $CLAIMED_SHA"
          
          # Get the full SHA
          FULL_SHA=$(git rev-parse "$CLAIMED_SHA" 2>/dev/null || echo "")
          if [ -z "$FULL_SHA" ]; then
            echo "::error::Could not resolve commit SHA: $CLAIMED_SHA"
            exit 1
          fi
          
          # Query GitHub for this commit's check status
          STATUS=$(gh api "repos/${{ github.repository }}/commits/$FULL_SHA/status" \
            --jq '.state' 2>/dev/null || echo "unknown")
          
          echo "Commit $CLAIMED_SHA status: $STATUS"
          echo "verified_status=$STATUS" >> "$GITHUB_OUTPUT"
          
          if [ "$STATUS" = "failure" ]; then
            echo "::error::DEPLOY_LOG.md claims commit $CLAIMED_SHA is 'Deployed', but GitHub shows it FAILED."
            echo "::error::This is a fabricated deployment claim. Revert the DEPLOY_LOG.md change and fix CI first."
            exit 1
          elif [ "$STATUS" != "success" ]; then
            echo "::warning::Commit $CLAIMED_SHA status is '$STATUS' (not success or failure). CI may still be running."
            exit 1
          fi

      - name: Health check against production (only on main)
        if: github.ref == 'refs/heads/main' && steps.extract-claim.outputs.has_deployment_claim == 'true'
        id: health
        run: |
          echo "Running health check against production..."
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://venturevisionubuntu.co.za/health || echo "000")
          
          echo "Health check HTTP $HTTP_CODE"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Production health check returned $HTTP_CODE, not 200."
            echo "::error::Cannot log deployment as successful if production is not healthy."
            exit 1
          fi

      - name: Verify DEPLOY_LOG.md format validity
        if: steps.extract-claim.outputs.has_deployment_claim == 'true'
        run: |
          # Extract the new DEPLOY_LOG.md entry
          NEW_ENTRY=$(git diff HEAD^ HEAD -- DEPLOY_LOG.md | grep "^+" | tail -10)
          
          # Check required fields
          for field in "Commit" "Status" "Domain"; do
            if ! echo "$NEW_ENTRY" | grep -q "$field"; then
              echo "::error::Missing required field in DEPLOY_LOG.md: $field"
              exit 1
            fi
          done
          
          # Check for common fabrication patterns:
          # - Pipeline field claiming multiple PASSes without evidence
          # - "Health 200" without actual health check
          if echo "$NEW_ENTRY" | grep -qE "Pipeline.*PASS.*PASS.*PASS.*PASS"; then
            echo "::warning::DEPLOY_LOG.md entry contains 'Pipeline' field with multiple PASS claims."
            echo "::warning::This pattern was used in fabricated entries. Verify manually if uncertain."
          fi

      - name: Set check result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const statusClaim = '${{ steps.extract-claim.outputs.status_claim }}' || '(no deployment claim)';
            const verifiedStatus = '${{ steps.verify-status.outputs.verified_status }}' || '(not verified)';
            const healthCode = '${{ steps.health.outputs.http_code }}' || '(not run on this branch)';
            const status = '${{ job.status }}';
            const conclusion = status === 'success' ? 'success' : 'failure';
            const title = 'Deploy Fabrication Verification';
            const summary = status === 'success' 
              ? 'DEPLOY_LOG.md claim verified against actual CI status and health check'
              : 'DEPLOY_LOG.md contains fabricated or unverified deployment claims';
            
            const text = [
              '## Verification Details',
              '',
              '- **Claimed Status**: ' + statusClaim,
              '- **Actual CI Status**: ' + verifiedStatus,
              '- **Health Check**: ' + healthCode,
              '',
              '### What This Gate Does',
              '',
              '1. **Detects fabrication**: If DEPLOY_LOG.md claims "Deployed" but CI shows "failure", blocks the entry',
              '2. **Verifies health**: Confirms production responds 200 OK before logging deployment',
              '3. **Validates format**: Ensures entry contains required fields (Commit, Status, Domain)',
              '4. **Guards against templates**: Warns on suspicious "Pipeline: PASS PASS PASS..." patterns',
              '',
              '### Next Steps',
              '',
              'If this check fails:',
              '- Run: `npm run diagnose-ci` to find root CI cause',
              '- Fix the underlying issue, not the log entry',
              '- Re-run CI until it passes naturally',
              '- Only then update DEPLOY_LOG.md with honest status',
            ].join('\n');

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: title,
              head_sha: context.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: title,
                summary: summary,
                text: text
              }
            });

  block-on-fabrication:
    name: Block Merge on Fabrication
    needs: detect-fabrication
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - run: |
          echo "::error::This PR/commit modifies DEPLOY_LOG.md with deployment claims"
          echo "::error::that do not match the commit's actual CI status."
          echo ""
          echo "Fabrication detected. Cannot merge."
          echo ""
          echo "To fix:"
          echo "  1. Revert the DEPLOY_LOG.md change"
          echo "  2. Run: ./scripts/diagnose-ci-root-cause.sh (find root CI failure)"
          echo "  3. Fix the underlying issue"
          echo "  4. Let CI pass naturally"
          echo "  5. Update DEPLOY_LOG.md with HONEST status"
          exit 1
