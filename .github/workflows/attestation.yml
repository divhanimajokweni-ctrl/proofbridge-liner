name: Commit Attestation Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  attest:
    name: Validate Commit Attestation
    if: false  # Disabled — known broken: can't carry ATTESTATION block through GitHub merge commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read commit message
        id: commit
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate attestation block exists
        run: |
          MSG="${{ steps.commit.outputs.message }}"
          if ! echo "$MSG" | grep -q "ATTESTATION:"; then
            echo "::error::REJECTED — No ATTESTATION block found in commit message."
            echo "::error::Every commit must include an ATTESTATION block. See AGENTS.md."
            exit 1
          fi
          echo "✓ ATTESTATION block present"

      - name: Validate branch_verified field
        run: |
          MSG="${{ steps.commit.outputs.message }}"
          if ! echo "$MSG" | grep -q "branch_verified:"; then
            echo "::error::REJECTED — branch_verified field missing from ATTESTATION block."
            exit 1
          fi
          BRANCH_FIELD=$(echo "$MSG" | grep "branch_verified:" | sed 's/.*branch_verified:\s*//' | tr -d ' ')
          echo "✓ branch_verified: $BRANCH_FIELD"

      - name: Validate pre_flight field
        run: |
          MSG="${{ steps.commit.outputs.message }}"
          if ! echo "$MSG" | grep -q "pre_flight: PASSED"; then
            echo "::error::REJECTED — pre_flight field missing or not PASSED."
            echo "::error::Agent must complete pre-flight protocol before committing."
            exit 1
          fi
          echo "✓ pre_flight: PASSED"

      - name: Validate session_owner field
        run: |
          MSG="${{ steps.commit.outputs.message }}"
          if ! echo "$MSG" | grep -q "session_owner:"; then
            echo "::error::REJECTED — session_owner field missing from ATTESTATION block."
            exit 1
          fi
          echo "✓ session_owner present"

      - name: Validate review_token
        env:
          REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}
        run: |
          MSG="${{ steps.commit.outputs.message }}"

          if ! echo "$MSG" | grep -q "review_token:"; then
            echo "::error::REJECTED — review_token field missing from ATTESTATION block."
            exit 1
          fi

          # Extract token value from commit message (format: sha256:XXXXXXXX)
          ACTUAL=$(echo "$MSG" | grep "review_token:" | sed 's/.*sha256://' | tr -d ' \n\r')

          if [ -z "$ACTUAL" ]; then
            echo "::error::REJECTED — review_token value is empty or malformed."
            echo "::error::Expected format: review_token: sha256:<8-char-hex>"
            exit 1
          fi

          if [ -z "$REVIEW_TOKEN" ]; then
            echo "::error::CONFIGURATION ERROR — REVIEW_TOKEN secret is not set."
            echo "::error::Go to repo Settings > Secrets > Actions and add REVIEW_TOKEN."
            exit 1
          fi

          # Compute expected prefix from secret
          EXPECTED=$(echo -n "$REVIEW_TOKEN" | sha256sum | cut -c1-8)

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::REJECTED — review_token is invalid."
            echo "::error::Token prefix mismatch. Commit is not from an authorised agent."
            exit 1
          fi

          echo "✓ review_token valid"

      - name: Validate branch is not main (direct push block)
        if: github.event_name == 'push'
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "::error::REJECTED — Direct push to main is forbidden."
            echo "::error::main is a mirror of compliance-fabric. Use a PR."
            exit 1
          fi
          echo "✓ Branch: $BRANCH — not a forbidden direct-push target"

      - name: Attestation passed
        run: |
          echo "============================================"
          echo "ATTESTATION GATE: PASSED"
          echo "Commit: $(git log -1 --pretty=%h) $(git log -1 --pretty=%s)"
          echo "Branch: ${{ github.ref_name }}"
          echo "============================================"
