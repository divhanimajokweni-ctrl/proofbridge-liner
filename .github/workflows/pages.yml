name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs directory exists
        id: check_docs
        run: |
          if [ -d "docs" ]; then
            echo "docs_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.12
        if: steps.check_docs.outputs.docs_exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        if: steps.check_docs.outputs.docs_exists == 'true'
        run: |
          pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

      - name: Build documentation site
        if: steps.check_docs.outputs.docs_exists == 'true'
        run: |
          if [ -f "docs/mkdocs.yml" ]; then
            mkdocs build -f docs/mkdocs.yml
          else
            echo "No mkdocs.yml found — generating static docs from markdown"
            mkdir -p _site
            cp -r docs/* _site/ 2>/dev/null || true
          fi

      - name: Upload artifact
        if: steps.check_docs.outputs.docs_exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    if: needs.build-docs.result == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
