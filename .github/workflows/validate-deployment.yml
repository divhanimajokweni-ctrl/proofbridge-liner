name: Validate Deployment Readiness

on:
  push:
    branches: [main, repair/deployment-readiness-*]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma Validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Prisma Generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Check for merge conflict markers
        run: |
          if grep -r '^<<<<<<< ' . --include='*.ts' --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.prisma' --include='*.json' --include='*.lock' --include='*.yml' --include='*.yaml' --include='*.sh' --include='Caddyfile' --include='*.env*' --include='.gitignore'; then
            echo "::error::Merge conflict markers found!"
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
