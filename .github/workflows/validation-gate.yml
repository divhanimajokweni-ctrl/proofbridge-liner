name: Validation Gate

on:
  push:
    branches: [compliance-fabric]
  pull_request:
    branches: [compliance-fabric]

env:
  NODE_VERSION: '20.x'

jobs:
  validate:
    name: Behavioral Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Enable Corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@11.11.0 --activate

      # ── 1. Critical file gate ──────────────────────────────────
      - name: Critical file presence
        run: |
          echo "::group::Critical File Check"
          for f in app/api/verify/route.ts app/api/mint/route.ts src/middleware.ts AGENTS.md; do
            if [ -f "$f" ]; then
              echo "✅ $f — OK"
            else
              echo "❌ $f — MISSING"
              echo "::error file=$f::Critical file missing"
              exit 1
            fi
          done
          echo "::endgroup::"

      # ── 2. SDD handoff files gate ──────────────────────────────
      - name: SDD handoff presence
        run: |
          echo "::group::SDD Handoff Files"
          for f in active/INVESTIGATION.md active/PLAN.md active/VALIDATION.md; do
            if [ -f "$f" ]; then
              echo "✅ $f — OK"
            else
              echo "❌ $f — MISSING"
              echo "::error file=$f::SDD handoff file missing"
              exit 1
            fi
          done
          echo "::endgroup::"

      # ── 3. Validate VALIDATION.md contains PASS ────────────────
      - name: Validation status check
        run: |
          echo "::group::Validation Status"
          if grep -q "PASS" active/VALIDATION.md; then
            echo "✅ VALIDATION.md — PASS"
          else
            echo "❌ VALIDATION.md — No PASS status found"
            exit 1
          fi
          echo "::endgroup::"

      # ── 4. Install deps & build ────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation
        run: pnpm run build
        continue-on-error: true

      # ── 5. Docker build check ──────────────────────────────────
      - name: Docker build (daemon)
        run: |
          echo "::group::Docker Build"
          docker build -t proofbridge-daemon:test --file Dockerfile .
          echo "✅ Docker image built successfully"
          echo "::endgroup::"

      # ── 6. Billing config consistency ──────────────────────────
      - name: Billing config check
        run: |
          echo "::group::Billing Config"
          if grep -q "monthlyLimit" lib/billing/tiers.ts; then
            echo "✅ lib/billing/tiers.ts — tiers defined"
          else
            echo "❌ lib/billing/tiers.ts — missing"
            exit 1
          fi
          echo "::endgroup::"

      # ── 7. Deployment artifact exclusion ───────────────────────
      - name: Gitignore compliance
        run: |
          echo "::group::Gitignore Compliance"
          for d in .next node_modules out dist cache .cache broadcast .vercel; do
            if grep -q "^$d$" .gitignore 2>/dev/null || grep -q "^$d/" .gitignore 2>/dev/null; then
              echo "✅ $d — gitignored"
            else
              echo "ℹ️  $d — not explicitly gitignored (may be handled by parent rule)"
            fi
          done
          echo "::endgroup::"
