name: CI

on:
  push:
    branches: [main, zoo-submission, zoo.dev-amd-ai-dev-submission]
  pull_request:

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci-test.db
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Database
        run: bunx prisma generate

      - name: Lint
        run: bun run lint --if-present || true

      - name: Build (production)
        run: |
          NEXT_IGNORE_TS=1 bun run build || bunx next build

      - name: Verify build output
        run: test -d .next && echo "Build succeeded ✅" || echo "Build output missing ⚠️"
