name: Gate-1 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript compliance fabric
        run: npm run build

      - name: Gate-1 and Liquidity Leap smoke tests
        run: node --test test/gate1-smoke.test.js

      - name: Verify Vercel route contract
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const cfg = JSON.parse(fs.readFileSync('vercel.json', 'utf8'))
          const routes = cfg.routes || []
          const must = [
            ['/api/health', '/api/verify.js'],
            ['/api/status', '/api/verify.js'],
            ['/api/verify', '/api/verify.js'],
            ['/api/mint', '/api/mint.js'],
            ['/api/liquidity-leap/telemetry', '/api/liquidity-leap/telemetry.js'],
          ]
          for (const [src, dest] of must) {
            if (!routes.some((r) => r.src === src && r.dest === dest)) {
              throw new Error(`missing route ${src} -> ${dest}`)
            }
          }
          NODE
